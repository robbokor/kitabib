          '<span class="chip ok">'+icon('users')+'Alter '+t.ageMin+'–'+t.ageMax+'</span>'+
          t.cats.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div>'+
        '<div class="r-sub" style="margin-top:14px">'+esc(t.publisher)+' · '+t.year+' · '+esc(t.lang)+' · ISBN '+esc(t.isbn)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="section"><span class="eyebrow">Exemplare ('+cs.length+')</span>'+
      '<div class="list">'+cs.map(c => {
        const l = loanOfCopy(c.id), over = l && isOverdue(l);
        const st = l ? 'loaned' : c.status;
        return '<div class="copy-row"><span class="stripe '+(over?'overdue':st)+'"></span>'+
          '<span class="r-main"><span class="r-title inv">'+esc(c.inv)+'</span>'+
          '<span class="r-sub">'+(l ? 'bei '+esc(child(l.childId).name)+' · fällig '+fmtDate(l.due)
              : c.status==='damaged' ? 'nach Rückgabe gemeldet' : 'im Regal')+'</span></span>'+
          '<span class="r-side">'+statusChip(st, over)+
          (l ? '' : '<button class="btn btn-sm" data-copy-status="'+c.id+'">'+icon('swap')+'Status</button>')+
          '<button class="btn btn-sm" data-label-copy="'+c.id+'">'+icon('label')+'Etikett</button></span></div>';
      }).join('')+'</div>'+
      '<button class="btn btn-sm" data-add-copy="'+t.id+'">'+icon('plus')+'Weiteres Exemplar anlegen</button>'+
    '</div>'+
  '</div>';
}

function screenScan(){
  return '<div class="stack">'+
    '<div><h1 class="screen-title">Scannen</h1><p class="screen-sub">Die drei Vorgänge, die am Tresen zählen.</p></div>'+
    '<div class="hero-actions">'+
      '<button class="hero-btn" data-act="start-loan">'+icon('scan','hb-icon')+
        '<span><span class="hb-label">Ausleihen</span><span class="hb-hint">Kinderkarte, dann Bücher</span></span></button>'+
      '<button class="hero-btn alt" data-act="start-return">'+icon('swap','hb-icon')+
        '<span><span class="hb-label">Zurückgeben</span><span class="hb-hint">Einzeln oder im Schnellmodus</span></span></button>'+
    '</div>'+
    '<button class="sub-btn" data-act="start-add" style="min-height:74px">'+icon('plus')+
      '<span><span style="font-size:17px">Neues Buch</span><span class="sb-hint">ISBN scannen, Cover fotografieren oder manuell eingeben</span></span></button>'+
    '<div class="notice calm">'+icon('shield')+'<span><span class="n-title">Scan-Schutz</span>'+
      '<span class="n-body">Ein Code, der nach dem Erfassen vor der Kamera liegen bleibt, wird '+(SCAN_LOCK_MS/1000)+' Sekunden lang nicht erneut verbucht.</span></span></div>'+
  '</div>';
}
</script>
<script>
/* --------------------------------------------------------------- Kinder */
let kidFilter = '';
function screenChildren(){
  const list = echteKinder().filter(k => !kidFilter || k.groupId === kidFilter);
  const active = list.filter(k=>k.active), inactive = list.filter(k=>!k.active);
  const konten = gruppenkonten().filter(k => !kidFilter || k.groupId === kidFilter);
  const rowFor = k => {
    const ls = loansOfChild(k.id), od = ls.filter(isOverdue).length;
    return '<button class="row" data-child="'+k.id+'"><span class="avatar">'+esc(k.name[0])+'</span>'+
      '<span class="r-main"><span class="r-title">'+esc(k.name)+'</span>'+
      '<span class="r-sub">'+esc(groupName(k.groupId))+(k.active?'':' · Konto inaktiv')+'</span></span>'+
      '<span class="r-side">'+
        (od ? '<span class="chip overdue">'+icon('alert')+plural(od,'überfällig','überfällig')+'</span>' : '')+
        (ls.length ? '<span class="chip loaned">'+icon('book')+plural(ls.length,'Buch','Bücher')+'</span>'
                   : '<span class="chip">keine Ausleihe</span>')+
        icon('next')+'</span></button>';
  };
  return '<div class="stack">'+
    '<div class="head-row"><div><h1 class="screen-title">Kinder</h1>'+
      '<p class="screen-sub">'+plural(echteKinder().filter(k=>k.active).length,'aktives Konto','aktive Konten')+
      (gruppenkonten().length ? ' · '+plural(gruppenkonten().length,'Gruppenkonto','Gruppenkonten') : '')+
      ' · nur die Angaben, die die Bibliothek braucht</p></div>'+
      '<button class="btn btn-sm" data-go="cards">'+icon('printer')+'Karten drucken</button></div>'+
    '<div class="toggle-row"><button class="toggle" data-group="" aria-pressed="'+(kidFilter?'false':'true')+'">Alle Gruppen</button>'+
      S.groups.map(g=>'<button class="toggle" data-group="'+g.id+'" aria-pressed="'+(kidFilter===g.id?'true':'false')+'">'+esc(g.name)+'</button>').join('')+'</div>'+
    '<div class="list">'+active.map(rowFor).join('')+'</div>'+
    (konten.length ? '<div class="section"><span class="eyebrow">Gruppenkonten</span><div class="list">'+
      konten.map(k => { const ls = loansOfChild(k.id), od = ls.filter(isOverdue).length;
        return '<button class="row" data-child="'+k.id+'"><span class="avatar">'+icon('users')+'</span>'+
          '<span class="r-main"><span class="r-title">'+esc(k.name)+'</span>'+
          '<span class="r-sub">Gruppenkonto · '+grenzeText(k)+' · '+leihdauerFuer(k)+' Tage</span></span>'+
          '<span class="r-side">'+
            (od ? '<span class="chip overdue">'+icon('alert')+plural(od,'überfällig','überfällig')+'</span>' : '')+
            (ls.length ? '<span class="chip loaned">'+icon('book')+plural(ls.length,'Buch','Bücher')+'</span>'
                       : '<span class="chip">keine Ausleihe</span>')+
            icon('next')+'</span></button>'; }).join('')+'</div></div>' : '')+
    (inactive.length ? '<div class="section"><span class="eyebrow">Inaktive Konten</span><div class="list">'+inactive.map(rowFor).join('')+'</div></div>' : '')+
  '</div>';
}

function screenChild(){
  const k = child(route.id);
  if (!k) return screenChildren();
  const ls = loansOfChild(k.id);
  const history = S.loans.filter(l => l.childId===k.id && l.returnedAt).length;
  if (k.anonym){
    return '<div class="stack">'+backTo('children','Kinder')+
      '<div><h1 class="screen-title">'+esc(k.name)+'</h1>'+
      '<p class="screen-sub">Die Personendaten wurden gelöscht</p></div>'+
      '<div class="notice calm">'+icon('shield')+'<span><span class="n-title">Ohne Personenbezug</span>'+
      '<span class="n-body">Vorname, Gruppe und Kartenkennung sind entfernt. Erhalten geblieben ist nur die Zahl der Ausleihen ('+
      plural(history,'Rückgabe','Rückgaben')+'), damit die Bestandsstatistik vollständig bleibt.</span></span></div>'+
    '</div>';
  }
  if (istGruppenkonto(k)){
    const offen = loansOfChild(k.id);
    return '<div class="stack">'+backTo('children','Kinder')+
      '<div class="head-row"><div style="display:flex;gap:14px;align-items:center">'+
        '<span class="avatar" style="width:56px;height:56px">'+icon('users')+'</span>'+
        '<div><h1 class="screen-title">'+esc(k.name)+'</h1>'+
        '<p class="screen-sub">Gruppenkonto · '+grenzeText(k)+' · '+leihdauerFuer(k)+' Tage Frist</p></div></div>'+
        '<button class="btn btn-sm" data-act="loan-for-child">'+icon('scan')+'Für die Gruppe ausleihen</button></div>'+
      '<div class="section"><span class="eyebrow">Bücher im Gruppenraum ('+offen.length+')</span>'+
        (offen.length ? '<div class="list">'+offen.map(l => { const c = copy(l.copyId), t = title(c.titleId), over = isOverdue(l);
            return '<div class="row"><span class="stripe '+(over?'overdue':'loaned')+'"></span>'+
              '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
              '<span class="r-sub">'+esc(c.inv)+' · fällig '+fmtDate(l.due)+'</span></span>'+
              '<span class="r-side">'+statusChip('loaned', over)+
              '<button class="btn btn-sm" data-extend="'+l.id+'">Verlängern</button></span></div>'; }).join('')+'</div>'
          : '<div class="card"><div class="empty">'+icon('book')+'<span class="e-title">Zurzeit keine Bücher im Gruppenraum</span></div></div>')+
      '</div>'+
      '<div class="section"><span class="eyebrow">Ausweis der Gruppe</span>'+
        '<div class="kidcard"><div class="qr-frame kc-qr">'+qrSVG(k.token)+'</div>'+
          '<div style="flex:1"><div class="kc-name">'+esc(k.name)+'</div>'+
          '<div class="kc-group">Gruppenkonto</div>'+
          '<div class="kc-org">'+esc(S.org.name)+'</div>'+
          '<div class="token" style="margin-top:10px">'+esc(k.token)+'</div>'+
          '<div class="hint" style="margin-top:6px">Am besten im Gruppenordner aufbewahren – hinter diesem Konto steht keine Person.</div>'+
          '<div class="btn-row" style="margin-top:12px">'+
            (istAdmin() ? '<button class="btn btn-sm" data-lost-card="'+k.id+'">'+icon('refresh')+'Karte ersetzen</button>' : '')+
            '<button class="btn btn-sm" data-print-card="'+k.id+'">'+icon('printer')+'Karte drucken</button>'+
          '</div></div></div>'+
      '</div>'+
      (istAdmin() ? '<div class="section"><span class="eyebrow">Konto</span>'+
        '<button class="btn btn-sm btn-danger" style="align-self:flex-start" data-gruppenkonto-weg="'+k.id+'">'+
          icon('trash')+'Gruppenkonto entfernen</button>'+
        (offen.length ? '<p class="hint">Erst die '+plural(offen.length,'Buch','Bücher')+' zurücknehmen.</p>' : '') +
      '</div>' : '')+
    '</div>';
  }
  const geschwister = k.familyId ? S.children.filter(x => x.familyId === k.familyId && x.id !== k.id && !x.anonym) : [];
  return '<div class="stack">'+
    '<button class="btn btn-ghost btn-sm" data-nav="children">'+icon('back')+'Kinder</button>'+
    '<div class="head-row"><div style="display:flex;gap:14px;align-items:center">'+
      '<span class="avatar" style="width:56px;height:56px;font-size:22px">'+esc(k.name[0])+'</span>'+
      '<div><h1 class="screen-title">'+esc(k.name)+'</h1>'+
      '<p class="screen-sub">'+esc(groupName(k.groupId))+' · '+(k.active?'aktiv':'inaktiv')+' · '+plural(history,'Rückgabe','Rückgaben')+' bisher</p></div></div>'+
      '<button class="btn btn-sm" data-act="loan-for-child">'+icon('scan')+'Für '+esc(k.name)+' ausleihen</button></div>'+
    '<div class="section"><span class="eyebrow">Aktuelle Ausleihen ('+ls.length+
      (grenzeFuer(k)===Infinity ? ' · unbegrenzt' : ' von max. '+grenzeFuer(k))+')</span>'+
      (ls.length ? '<div class="list">'+ls.map(l => { const c = copy(l.copyId), t = title(c.titleId), over = isOverdue(l);
          return '<div class="row"><span class="stripe '+(over?'overdue':'loaned')+'"></span>'+
            '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
            '<span class="r-sub">'+esc(c.inv)+' · fällig '+fmtDate(l.due)+'</span></span>'+
            '<span class="r-side">'+statusChip('loaned', over)+
            '<button class="btn btn-sm" data-extend="'+l.id+'">Verlängern</button></span></div>'; }).join('')+'</div>'
        : '<div class="card"><div class="empty">'+icon('book')+'<span class="e-title">Keine offenen Ausleihen</span></div></div>')+
    '</div>'+
    '<div class="section"><span class="eyebrow">Bibliothekskarte</span>'+
      '<div class="kidcard"><div class="qr-frame kc-qr">'+qrSVG(k.token)+'</div>'+
        '<div style="flex:1">'+
        (karteEinstellungen().feld === 'symbol'
          ? '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'+
            '<span style="font-size:38px;line-height:1">'+zeichenFuer(k)+'</span>'+
            (istAdmin() ? '<button class="btn btn-sm" data-zeichen-aendern="'+k.id+'">Zeichen ändern</button>' : '')+
            '</div>'
          : karteEinstellungen().feld === 'aufkleben'
          ? '<div class="hint" style="margin-bottom:8px">Auf der gedruckten Karte bleibt ein Feld zum Aufkleben frei.</div>'
          : '')+
        '<div class="kc-name">'+esc(k.name)+'</div>'+
        (karteEinstellungen().gruppe ? '<div class="kc-group">'+esc(groupName(k.groupId))+'</div>' : '')+
        '<div class="kc-org">'+esc(S.org.name)+'</div>'+
        '<div class="token" style="margin-top:10px">'+esc(k.token)+'</div>'+
        '<div class="hint" style="margin-top:6px">Der Code enthält nur diesen Zufallswert – keinen Namen, keine Gruppe.</div>'+
        '<div class="btn-row" style="margin-top:12px">'+
          (istAdmin() ? '<button class="btn btn-sm" data-lost-card="'+k.id+'">'+icon('refresh')+'Karte verloren</button>' : '')+
          '<button class="btn btn-sm" data-print-card="'+k.id+'">'+icon('printer')+'Karte drucken</button>'+
        '</div></div></div>'+
    '</div>'+
    (geschwister.length ? '<div class="section"><span class="eyebrow">Geschwister</span>'+
      '<div class="list">'+geschwister.map(g => '<button class="row" data-child="'+g.id+'">'+
      '<span class="avatar">'+esc(g.name[0])+'</span><span class="r-main"><span class="r-title">'+esc(g.name)+'</span>'+
      '<span class="r-sub">'+esc(groupName(g.groupId))+' · '+plural(loansOfChild(g.id).length,'Buch','Bücher')+'</span></span>'+
      '<span class="r-side">'+icon('next')+'</span></button>').join('')+'</div>'+
      '<p class="hint">Geschwister sind nur zur Übersicht verbunden – ausgeliehen wird immer auf das einzelne Kind.</p></div>' : '')+
    (istAdmin() ? '<div class="section"><span class="eyebrow">Konto</span><div class="btn-row">'+
      '<select class="pill" data-move-child="'+k.id+'">'+S.groups.map(g=>'<option value="'+g.id+'"'+(g.id===k.groupId?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select>'+
      '<button class="btn btn-sm'+(k.active?' btn-danger':'')+'" data-toggle-active="'+k.id+'">'+
        (k.active ? icon('minus')+'Konto deaktivieren' : icon('check')+'Konto aktivieren')+'</button>'+
      (!k.active ? '<button class="btn btn-sm btn-danger" data-anonymisieren="'+k.id+'">'+icon('trash')+'Personendaten löschen</button>' : '')+
    '</div>'+
    (k.active && ls.length ? '<p class="hint">Ein Konto mit offenen Ausleihen wird nicht deaktiviert – erst '+
      (ls.length===1 ? 'das Buch' : 'die '+ls.length+' Bücher')+' zurücknehmen.</p>' : '')+
    (!k.active ? '<p class="hint">Nach Ablauf der von der Einrichtung festgelegten Aufbewahrungsfrist können die Personendaten gelöscht werden. Die Ausleihzahlen bleiben dann ohne Personenbezug erhalten.</p>' : '')+
    '</div>' : '')+
  '</div>';
}

/* ------------------------------------------------------- Überfällige */
function screenOverdue(){
  const list = overdueLoans().sort((a,b)=>a.due<b.due?-1:1);
  return '<div class="stack">'+
    '<button class="btn btn-ghost btn-sm" data-nav="start">'+icon('back')+'Start</button>'+
    '<div><h1 class="screen-title">Überfällige Bücher</h1>'+
    '<p class="screen-sub">'+plural(list.length,'Ausleihe','Ausleihen')+' über die Frist von '+S.org.loanDays+' Tagen hinaus</p></div>'+
    (list.length ? '<div class="list">'+list.map(l => { const c = copy(l.copyId), t = title(c.titleId), k = child(l.childId);
        return '<div class="row"><span class="stripe overdue"></span>'+
          '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
          '<span class="r-sub">'+esc(k.name)+' · '+esc(groupName(k.groupId))+' · fällig war '+fmtDate(l.due)+'</span></span>'+
          '<span class="r-side"><span class="chip overdue">'+icon('alert')+plural(daysDiff(l.due,todayISO()),'Tag','Tage')+'</span>'+
          '<button class="btn btn-sm" data-extend="'+l.id+'">Verlängern</button></span></div>'; }).join('')+'</div>'
      : '<div class="card"><div class="empty">'+icon('check')+'<span class="e-title">Nichts überfällig</span></div></div>')+
  '</div>';
}
</script>
<script>
/* ------------------------------------------------------------- Mehr */
function screenMore(){
  const admin = istAdmin();
  const items = [
    ['settings','Einstellungen','Ausleihdauer, Grenzen, Einrichtungsname','more', true],
    ['groups','Gruppen','Anlegen, umbenennen','users', true],
    ['kategorien','Kategorien','Pädagogische Schlagwörter pflegen','label', true],
    ['cards','Bibliothekskarten','Karten für Gruppen drucken','card', false],
    ['labels','QR-Etiketten','Etiketten für Exemplare drucken','label', false],
    ['kinderimport','Kinder einlesen','Excel- oder CSV-Liste, auch in eine neue Gruppe','users', true],
    ['rollover','Jahreswechsel','Gesamten Bestand abgleichen, Ausgeschiedene deaktivieren','swap', true],
    ['bestand','Bestand übernehmen','Eigene Bücher einlesen und sichern','book', true],
    ['stats','Statistik','Bestand und Ausleihen in Zahlen','chart', true],
    ['log','Protokoll','Verwaltungsaktionen der letzten Zeit','list', true],
    ['anleitung','Kurzanleitung','Eine Seite für den Tresen, zum Ausdrucken','info', false],
    ['privacy','Datenschutz','Was gespeichert wird – und was nicht','shield', false]
  ].filter(i => admin || !i[4]);

  return '<div class="stack">'+
    '<div><h1 class="screen-title">Mehr</h1><p class="screen-sub">'+esc(S.org.name)+' · Verwaltung</p></div>'+
    '<div class="card pad stack" style="gap:12px">'+
      '<div><span style="font-weight:700">Angemeldet als</span>'+
      '<span class="r-sub" style="display:block">Im fertigen System entscheidet die Anmeldung darüber – hier zum Ausprobieren umschaltbar.</span></div>'+
      '<div class="toggle-row">'+
        '<button class="toggle" data-rolle="admin" aria-pressed="'+(admin?'true':'false')+'">Administrator</button>'+
        '<button class="toggle" data-rolle="mitarbeiter" aria-pressed="'+(admin?'false':'true')+'">Mitarbeiter/in</button>'+
      '</div>'+
      (admin ? '' : '<p class="hint">Als Mitarbeiter/in: Bücher suchen und erfassen, ausleihen, zurücknehmen, verlängern, Karten drucken. Einstellungen, Kinderkonten, Import und Statistik bleiben der Verwaltung vorbehalten.</p>')+
    '</div>'+
    '<div class="list">'+items.map(([id,t,sub,ic]) =>
      '<button class="row" data-go="'+id+'"><span class="avatar">'+icon(ic)+'</span>'+
      '<span class="r-main"><span class="r-title">'+esc(t)+'</span><span class="r-sub">'+esc(sub)+'</span></span>'+
      '<span class="r-side">'+icon('next')+'</span></button>').join('')+'</div>'+
    '<div class="notice calm">'+icon('info')+'<span><span class="n-title">Prototyp</span>'+
      '<span class="n-body">Alle Daten liegen nur in diesem Browser. Bestand und Kinder sind Demo-Daten.<br>Fassung '+esc(FASSUNG)+'</span></span>'+
      (admin ? '<span class="n-action"><button class="btn btn-sm" data-act="reset">'+icon('refresh')+'Zurücksetzen</button></span>' : '')+'</div>'+
  '</div>';
}

function backTo(name, label){ return '<button class="btn btn-ghost btn-sm" data-nav="'+name+'">'+icon('back')+esc(label)+'</button>'; }

function screenSettings(){
  const e = karteEinstellungen();
  return '<div class="stack">'+backTo('more','Mehr')+
    '<div><h1 class="screen-title">Einstellungen</h1><p class="screen-sub">Gelten für diese Einrichtung</p></div>'+
    '<div class="card pad stack">'+
      '<div class="grid-2">'+
        '<div class="field"><label for="setName">Name der Einrichtung</label><input id="setName" data-set="name" value="'+esc(S.org.name)+'"></div>'+
        '<div class="field"><label for="setDays">Ausleihdauer in Tagen</label><input id="setDays" data-set="loanDays" type="number" min="1" max="90" value="'+S.org.loanDays+'"></div>'+
        '<div class="field"><label for="setMax">Bücher gleichzeitig je Kind</label><input id="setMax" data-set="maxBooks" type="number" min="1" max="20" value="'+S.org.maxBooks+'"></div>'+
        '</div>'+
      '<p class="hint">Änderungen an der Ausleihdauer gelten für neue Ausleihen. Laufende behalten ihr Rückgabedatum.</p>'+
    '</div>'+

    '<div class="section"><span class="eyebrow">Gruppenkonten</span>'+
      '<div class="card pad stack">'+
        '<div class="grid-2">'+
          '<div class="field"><label for="setDaysG">Ausleihdauer in Tagen</label>'+
            '<input id="setDaysG" data-set="loanDaysGruppe" type="number" min="1" max="365" value="'+(S.org.loanDaysGruppe||28)+'"></div>'+
          '<div class="field"><label for="setMaxG">Bücher gleichzeitig (0 = unbegrenzt)</label>'+
            '<input id="setMaxG" data-set="maxBooksGruppe" type="number" min="0" max="200" value="'+(S.org.maxBooksGruppe||0)+'"></div>'+
        '</div>'+
        '<p class="hint">Gilt für Konten von Gruppen, nicht für Kinder. Themenkisten stehen oft wochenlang im Gruppenraum – '+
        'deshalb längere Frist und in der Regel keine Obergrenze. Angelegt werden Gruppenkonten unter Mehr → Gruppen.</p>'+
      '</div>'+
    '</div>'+

    '<div class="section"><span class="eyebrow">Was auf dem Bibliotheksausweis steht</span>'+
      '<div class="card pad stack" style="gap:16px">'+
        '<p class="hint">Jede Einrichtung entscheidet selbst. Denk daran: Die Karte ist ein Gegenstand, '+
        'der die Kita verlassen kann – jede Angabe darauf ist eine Angabe, die dann anderswo lesbar ist.</p>'+
        '<div class="toggle-row">'+
          '<button class="toggle" data-karte="vorname" aria-pressed="'+(e.vorname?'true':'false')+'">Vorname</button>'+
          '<button class="toggle" data-karte="gruppe" aria-pressed="'+(e.gruppe?'true':'false')+'">Gruppe</button>'+
          '<button class="toggle" data-karte="kita" aria-pressed="'+(e.kita?'true':'false')+'">Name der Kita</button>'+
        '</div>'+
        '<div class="field"><label>Feld zum Wiedererkennen</label>'+
          '<div class="toggle-row">'+
            '<button class="toggle" data-kartenfeld="keins" aria-pressed="'+(e.feld==='keins'?'true':'false')+'">Keines</button>'+
            '<button class="toggle" data-kartenfeld="aufkleben" aria-pressed="'+(e.feld==='aufkleben'?'true':'false')+'">Leeres Feld zum Aufkleben</button>'+
            '<button class="toggle" data-kartenfeld="symbol" aria-pressed="'+(e.feld==='symbol'?'true':'false')+'">Gedrucktes Zeichen</button>'+

/* Einstellungen, die beide Druckansichten teilen */
function druckLeiste(art){
  const d = druckEinstellungen();
  const liste = art === 'karte' ? KARTEN_FORMATE : ETIKETT_FORMATE;
  const aktuell = art === 'karte' ? d.karte : d.etikett;
  const format = art === 'karte' ? formatFinden(KARTEN_FORMATE, d.karte) : etikettFormat();
  const eigenAktiv = art === 'etikett' && aktuell === 'eigen';
  const e = d.eigenes || {};
  const feld = (name, beschriftung, wert) =>
    '<div class="field"><label for="eig_'+name+'">'+esc(beschriftung)+'</label>'+
    '<input id="eig_'+name+'" type="number" step="0.1" min="0" data-eigen="'+name+'" value="'+(wert||0)+'"></div>';

  return '<div class="card pad stack" style="gap:14px">'+
    '<div class="field"><label for="druckFormat">Bogenformat</label>'+
      '<select class="pill" id="druckFormat" data-druck-format="'+art+'">'+
      liste.map(f => '<option value="'+f.id+'"'+(f.id===aktuell?' selected':'')+'>'+esc(f.name)+'</option>').join('')+
      '</select></div>'+
    (eigenAktiv
      ? '<div class="grid-2">'+
          feld('breite','Etikett breit (mm)', e.breite)+ feld('hoehe','Etikett hoch (mm)', e.hoehe)+
          feld('spalten','Spalten', e.spalten)+ feld('zeilen','Zeilen', e.zeilen)+
          feld('luecke','Abstand waagerecht (mm)', e.luecke)+ feld('lueckeY','Abstand senkrecht (mm)', e.lueckeY)+
          feld('randX','Rand links (mm)', e.randX)+ feld('randY','Rand oben (mm)', e.randY)+
        '</div>'
      : (art === 'etikett'
          ? '<p class="hint">Etikett '+format.breite+' × '+format.hoehe+' mm, Abstand dazwischen '+
            (+format.luecke||0)+' mm waagerecht und '+(+format.lueckeY||0)+' mm senkrecht. '+
            'Diese Werte sind die üblichen – ob sie zu eurem Bogen passen, zeigt der Prüfbogen.</p>'
          : ''))+
    '<div class="grid-2">'+
      '<div class="field"><label for="offX">Feinjustierung waagerecht (mm)</label>'+
        '<input id="offX" type="number" step="0.5" min="-20" max="20" data-druck-off="offX" value="'+(+d.offX||0)+'"></div>'+
      '<div class="field"><label for="offY">Feinjustierung senkrecht (mm)</label>'+
        '<input id="offY" type="number" step="0.5" min="-20" max="20" data-druck-off="offY" value="'+(+d.offY||0)+'"></div>'+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="toggle" data-act="rahmen-umschalten" aria-pressed="'+(d.rahmen?'true':'false')+'">'+
        (d.rahmen ? 'Schnittlinien werden gedruckt' : 'Ohne Schnittlinien')+'</button>'+
      '<button class="btn btn-sm" data-act="pruefbogen">'+icon('printer')+'Prüfbogen drucken</button>'+
    '</div>'+
    '<div class="field" style="border-top:1px solid var(--line);padding-top:14px">'+
      '<label for="gemessen">Maßstab · zurzeit '+Math.round(druckSkala()*1000)/10+' %</label>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        '<input id="gemessen" type="number" step="0.5" min="40" max="250" data-druck-messwert '+
          'placeholder="gemessen" style="width:130px">'+
        '<span class="hint">mm – so lang ist die 100-mm-Linie auf dem <b>zuletzt gedruckten</b> Prüfbogen</span>'+
        (Math.abs(druckSkala()-1) > 0.005
          ? '<button class="btn btn-sm" data-act="massstab-zuruecksetzen">Auf 100 % zurück</button>' : '')+
      '</div>'+
      '<p class="hint">Prüfbogen drucken, die schwarze Linie messen, den Wert hier eintragen. '+
      'KitaBib rechnet den Maßstab fort – nach einer, spätestens zwei Runden misst die Linie 100 mm.</p>'+
    '</div>'+
    (() => {
      /* Wird der Massstab hochgesetzt, weil das Geraet verkleinert, passt
         irgendwann nicht mehr der ganze Bogen auf die bedruckbare Flaeche.
         Das laesst sich nicht wegrechnen – also sagen wir es. */
      /* Mit mitwachsender Seite steht die volle A4-Flaeche zur Verfuegung –
         eng wird es erst, wenn das Geraet zusaetzlich Rand freilaesst. */
      const k = druckSkala();
      const nutzbarB = 210, nutzbarH = 297;
      const l = +format.luecke || 0, lY = +format.lueckeY || 0;
      const gesamtB = format.spalten * format.breite + (format.spalten - 1) * l;
      const gesamtH = format.zeilen * format.hoehe + (format.zeilen - 1) * lY;
      const rX = format.randX != null ? +format.randX : (210 - gesamtB) / 2;
      const rY = format.randY != null ? +format.randY : (297 - gesamtH) / 2;
      const brauchtB = rX + gesamtB, brauchtH = rY + gesamtH;
      if (brauchtB <= nutzbarB + 0.5 && brauchtH <= nutzbarH + 0.5) return '';
      let passenSpalten = 0, x = rX;
      while (x + format.breite <= nutzbarB + 0.5){ passenSpalten++; x += format.breite + l; }
      let passenZeilen = 0, y = rY;
      while (y + format.hoehe <= nutzbarH + 0.5){ passenZeilen++; y += format.hoehe + lY; }
      return '<div class="notice overdue">'+icon('alert')+'<span><span class="n-title">Der Bogen passt nicht auf die bedruckbare Fläche</span>'+
        '<span class="n-body">Auf eine Seite passen nur '+
        Math.round(nutzbarB)+' × '+Math.round(nutzbarH)+' mm. Davon werden '+
        passenSpalten+' von '+format.spalten+' Spalten und '+passenZeilen+' von '+format.zeilen+' Zeilen erfasst – der Rest fällt weg. '+
        'Das lässt sich nicht wegrechnen: Was das Gerät nicht bedruckt, kann keine Einstellung hinzaubern. '+
        '<b>Etikettenbögen deshalb besser vom Rechner aus drucken</b> – dort im Druckdialog Ränder auf „keine" und Skalierung auf 100 % stellen, '+
        'dann ist der Maßstab hier wieder 100 %. Das Tablet bleibt für alles andere.</span></span></div>';
    })()+
    '<p class="hint">'+(art === 'etikett'
      ? 'Den Prüfbogen auf einfachem Papier drucken und gegen den Etikettenbogen halten – das kostet kein Etikett. '
      : 'Sitzt der erste Bogen daneben, mit der Feinjustierung verschieben. ')+
      'Im Druckdialog zusätzlich „Tatsächliche Größe" bzw. 100 % wählen, falls angeboten.</p>'+
  '</div>';
}

var kinderImport = { zeilen:null, datei:'', kopfzeile:true, spalteName:0, spalteKennung:-1, spalteGruppe:-1,
                     ziel:'neu', neueGruppe:'', fehler:null };

function importSpaltenRaten(){
  const k = kinderImport;
  if (!k.zeilen || !k.zeilen.length) return;
  const kopf = k.zeilen[0].map(z => String(z||'').toLowerCase());
  const finde = (...begriffe) => kopf.findIndex(z => begriffe.some(b => z.includes(b)));
  const n = finde('vorname','name','kind');
  const ken = finde('kennung','id','nummer');
  const gr = finde('gruppe');
  k.kopfzeile = n >= 0 || ken >= 0 || gr >= 0;
  k.spalteName = n >= 0 ? n : 0;
  k.spalteKennung = ken;
  k.spalteGruppe = gr;
  if (gr >= 0) k.ziel = 'datei';
}

/* Was aus der Datei wird: neu, schon vorhanden, oder unbrauchbar */
function importAnalyse(){
  const k = kinderImport;
  const out = { neu:[], vorhanden:[], fehler:[], gruppenNeu:[] };
  if (!k.zeilen) return out;
  const zeilen = k.zeilen.slice(k.kopfzeile ? 1 : 0);
  zeilen.forEach(z => {
    const name = String(z[k.spalteName] || '').trim();
    if (!name){ out.fehler.push('Zeile ohne Namen übersprungen'); return; }
    const kennung = k.spalteKennung >= 0 ? String(z[k.spalteKennung] || '').trim() : '';
    let gruppenName;
    if (k.ziel === 'datei' && k.spalteGruppe >= 0) gruppenName = String(z[k.spalteGruppe] || '').trim();
    else if (k.ziel === 'neu') gruppenName = k.neueGruppe.trim();
    else gruppenName = groupName(k.ziel);
    if (!gruppenName){ out.fehler.push('„'+name+'": keine Gruppe angegeben'); return; }
    const g = S.groups.filter(x => x.name.toLowerCase() === gruppenName.toLowerCase())[0];
    if (!g && out.gruppenNeu.indexOf(gruppenName) < 0) out.gruppenNeu.push(gruppenName);
    const schon = kennung
      ? S.children.filter(x => !istGruppenkonto(x) && x.importKey === kennung)[0]
      : S.children.filter(x => !istGruppenkonto(x) && x.name === name && g && x.groupId === g.id)[0];
    if (schon) out.vorhanden.push({ name, gruppe:gruppenName, grund: kennung ? 'Kennung schon vergeben' : 'Name in dieser Gruppe schon vorhanden' });
    else out.neu.push({ name, kennung, gruppe:gruppenName });
  });
  return out;
}

function importUebernehmen(){
  const a = importAnalyse();
  a.gruppenNeu.forEach(name => {
    if (!S.groups.filter(g => g.name.toLowerCase() === name.toLowerCase())[0]){
      S.groups.push({ id: uid('g'), name });
      logAction('Gruppe „'+name+'" beim Einlesen angelegt');
    }
  });
  const angelegt = [];
  a.neu.forEach(n => {
    const g = S.groups.filter(x => x.name.toLowerCase() === n.gruppe.toLowerCase())[0];
    const kind = { id: uid('k'), name: n.name, groupId: g.id, active: true,
                   token: newToken('K'), importKey: n.kennung || null, familyId: null };
    if (karteEinstellungen().feld === 'symbol') { S.children.push(kind); zeichenFuer(kind); }
    else S.children.push(kind);
    angelegt.push(kind);
  });
  logAction('Kinderliste eingelesen: '+angelegt.length+' Kinder, '+a.gruppenNeu.length+' neue Gruppen');
  save();
  kinderImport = { zeilen:null, datei:'', kopfzeile:true, spalteName:0, spalteKennung:-1, spalteGruppe:-1,
                   ziel:'neu', neueGruppe:'', fehler:null };
  go('cards');
  toast(angelegt.length+' Kinder angelegt – jetzt die Bibliothekskarten drucken.');
}

<script>
/* -------------------------------------------------------- Jahreswechsel */
let roll = { csv:null, analysis:null, result:null };
function defaultRolloverCSV(){
  const active = echteKinder().filter(k => k.active);
  const withLoans = active.find(k => loansOfChild(k.id).length);
  const withoutLoans = active.find(k => !loansOfChild(k.id).length && k !== withLoans);
  const skip = [withLoans && withLoans.id, withoutLoans && withoutLoans.id];
  const lines = ['Kennung;Vorname;Gruppe'];
  active.forEach((k, i) => {
    if (skip.includes(k.id)) return;                       // im neuen Jahr nicht mehr dabei
    let g = groupName(k.groupId);
    if (i === 2 || i === 7){ const other = S.groups.find(x => x.id !== k.groupId); if (other) g = other.name; }
    lines.push(k.importKey+';'+k.name+';'+g);
  });
  ['Ida','Ilias','Nora'].forEach((n, i) =>
    lines.push('kita-'+(2101+i)+';'+n+';'+S.groups[i % S.groups.length].name));
  return lines.join('\n');
}
function analyzeRollover(csv){
  const out = { neu:[], gleich:[], wechsel:[], fehlt:[], fehler:[] };
  const seen = {};
  csv.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, idx) => {
    if (idx === 0 && /kennung/i.test(line)) return;
    const p = line.split(';').map(s => s.trim());
    if (p.length < 3 || !p[1]){ out.fehler.push({ line, grund:'Zeile unvollständig' }); return; }
    const [key, name, gname] = p;
    const g = S.groups.find(x => x.name.toLowerCase() === gname.toLowerCase());
    if (!g){ out.fehler.push({ line, grund:'Gruppe "'+gname+'" gibt es nicht' }); return; }
    const ex = S.children.find(k => !istGruppenkonto(k) && k.importKey === key);
    if (ex){
      seen[ex.id] = true;
      if (ex.groupId !== g.id) out.wechsel.push({ id:ex.id, name:ex.name, from:groupName(ex.groupId), toId:g.id, to:g.name });
      else out.gleich.push({ id:ex.id, name:ex.name, group:g.name });
    } else out.neu.push({ key, name, groupId:g.id, group:g.name });
  });
  echteKinder().filter(k => k.active).forEach(k => {
    if (!seen[k.id]) out.fehlt.push({ id:k.id, name:k.name, group:groupName(k.groupId), loans:loansOfChild(k.id).length });
  });
  return out;
}
function applyRollover(a){
  const created = [];
  a.wechsel.forEach(w => { const k = child(w.id); if (k) k.groupId = w.toId; });
  a.neu.forEach(n => {
    const k = { id:uid('k'), name:n.name, groupId:n.groupId, active:true, token:newToken('K'), importKey:n.key, familyId:null };
    S.children.push(k); created.push(k);
  });
  let deactivated = 0, kept = 0;
  a.fehlt.forEach(f => {
    const k = child(f.id); if (!k) return;
    if (f.loans > 0){ kept++; return; }        // niemals automatisch deaktivieren, solange Bücher offen sind
    k.active = false; deactivated++;
  });
  logAction('Jahreswechsel: '+created.length+' neu, '+a.wechsel.length+' Gruppenwechsel, '+deactivated+' deaktiviert');
  save();
  return { created, deactivated, kept, moved:a.wechsel.length };
}

<script>
/* ================================================== Buchdaten per ISBN ====
   Hauptquelle ist die Deutsche Nationalbibliothek (SRU-Schnittstelle): sie
   fuehrt jede in Deutschland erschienene Ausgabe, kennzeichnet Verfasser und
   Illustrator getrennt und erlaubt den Abruf direkt aus dem Browser.
   Faellt sie aus, wird OpenLibrary befragt.
   ======================================================================== */
var Buchdaten = {
  quelleName: { dnb:'Deutsche Nationalbibliothek', openlibrary:'OpenLibrary', demo:'Demo-Datensatz' },

  normIsbn: function (roh) { return String(roh || '').replace(/[^0-9Xx]/g, '').toUpperCase(); },
  formatIsbn: function (i) {
    var d = this.normIsbn(i);
    return d.length === 13 ? d.replace(/^(\d{3})(\d)(\d{3})(\d{5})(\d)$/, '$1-$2-$3-$4-$5') : d;
  },

  suche: function (isbn) {
    var self = this, rein = this.normIsbn(isbn);
    return this.dnb(rein)
      .then(function (t) { return t || self.openLibrary(rein); })
      .then(function (t) { return t || self.demo(rein); })
      .catch(function () { return self.demo(rein); });
  },

  netzGesperrt: false,
  gedrosselt: false,
  /* Die Nationalbibliothek bremst bei vielen Abfragen (HTTP 429). Dann kurz warten. */
  holen: function (url, versuche) {
    var self = this;
    return fetch(url).then(function (r) {
      if (r.status === 429 && versuche > 0) {
        self.gedrosselt = true;
        return new Promise(function (res) { setTimeout(res, 1500); })
          .then(function () { return self.holen(url, versuche - 1); });
      }
      return r;
    }).catch(function (e) {
      self.netzGesperrt = true;                 // kein Netz oder Zugriff unterbunden
      throw e;
    });
  },

  dnb: function (isbn) {
    var self = this;
    var url = 'https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve' +
              '&query=num%3D' + encodeURIComponent(isbn) + '&recordSchema=oai_dc&maximumRecords=3';
    return this.holen(url, 2).then(function (r) {
      if (!r.ok) return null;
      self.gedrosselt = false;
      return r.text();
    }).then(function (xml) {
      if (!xml) return null;
      var doc = new DOMParser().parseFromString(xml, 'application/xml');
      var saetze = doc.getElementsByTagNameNS('*', 'dc');
      if (!saetze.length) return null;
      var rec = saetze[0];
      function feld(name) {
        var out = [], liste = rec.getElementsByTagNameNS('*', name);
        for (var i = 0; i < liste.length; i++) out.push(liste[i].textContent.trim());
        return out;
      }
      var rohTitel = feld('title')[0] || '';
      var teile = rohTitel.split(' / ')[0];               // Urheberangabe hinter dem Schraegstrich
      var titelTeile = teile.split(' : ');
      var autoren = [], illus = [];
      feld('creator').concat(feld('contributor')).forEach(function (e) {
        var name = e.replace(/\s*\[[^\]]*\]\s*$/, '').trim();
        var umgedreht = name.indexOf(',') > 0
          ? name.split(',').map(function (t) { return t.trim(); }).reverse().join(' ') : name;
        if (/Illustrator/i.test(e)) { if (illus.indexOf(umgedreht) < 0) illus.push(umgedreht); }
        else if (/Verfasser|Autor/i.test(e)) { if (autoren.indexOf(umgedreht) < 0) autoren.push(umgedreht); }
      });
      /* Wer als Illustrator gefuehrt wird, gehoert bei Bilderbuechern dorthin –
         solange noch jemand anderes als Verfasser uebrig bleibt. */
      var nurAutoren = autoren.filter(function (a) { return illus.indexOf(a) < 0; });
      if (nurAutoren.length) autoren = nurAutoren;
      var verlagRoh = feld('publisher')[0] || '';
      var verlag = verlagRoh.indexOf(' : ') > 0 ? verlagRoh.split(' : ').slice(1).join(' : ') : verlagRoh;
      var jahr = parseInt((feld('date')[0] || '').replace(/\D/g, '').slice(0, 4), 10);
      var themen = feld('subject').join(' ');
      return {
        quelle: 'dnb',
        title: titelTeile[0] || rohTitel,
        subtitle: titelTeile.slice(1).join(' : '),
        author: autoren.join(', '),
        illustrator: illus.join(', '),
        publisher: verlag,
        year: isNaN(jahr) ? new Date().getFullYear() : jahr,
        isbn: self.formatIsbn(isbn),
        lang: 'Deutsch',
        kinderbuch: /Kinder|Jugend/i.test(themen),
        blurb: ''
      };
    }).catch(function () { return null; });
  },

  openLibrary: function (isbn) {
    var self = this;
    return fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var k = j && j['ISBN:' + isbn];
        if (!k) return null;
        var jahr = parseInt(String(k.publish_date || '').replace(/\D/g, '').slice(-4), 10);
        return {
          quelle: 'openlibrary',
          title: k.title || '',
          subtitle: k.subtitle || '',
          author: (k.authors || []).map(function (a) { return a.name; }).join(', '),
          illustrator: '',
          publisher: (k.publishers || []).map(function (p) { return p.name; })[0] || '',
          year: isNaN(jahr) ? new Date().getFullYear() : jahr,
          isbn: self.formatIsbn(isbn),
          lang: 'Deutsch',
          blurb: ''
        };
      }).catch(function () { return null; });
  },

  /* Ohne Netz: die im Prototyp hinterlegten Beispielbücher */
  demo: function (isbn) {
    var self = this;
    var treffer = LOOKUP.filter(function (b) { return self.normIsbn(b.isbn) === isbn; })[0];
    if (!treffer) return null;
    var kopie = Object.assign({}, treffer, { quelle: 'demo', cats: treffer.cats.slice() });
    return kopie;
  }
};
</script>
<script>
/* ==================================================== Druckbogen-Formate ===
   Masse in Millimeter auf A4 (210 x 297). Die Seitenraender ergeben sich aus
   der Teilung; die Feinjustierung gleicht den Versatz des jeweiligen Druckers
   aus – einmal einstellen, dann sitzt jeder weitere Bogen. */
var ETIKETT_FORMATE = [
  /* luecke = Abstand zwischen den Etiketten, randX/randY = Abstand zum Blattrand.
     Fehlen randX/randY, wird das Raster mittig gesetzt. Die Werte sind die
     ueblichen – mit dem Pruefbogen gegen den eigenen Bogen abgleichen. */
  { id:'70x37',  name:'70 × 37 mm · 24 je Bogen',     breite:70,   hoehe:37,   spalten:3, zeilen:8,
    luecke:0,   lueckeY:0 },
  { id:'63x38',  name:'63,5 × 38,1 mm · 21 je Bogen', breite:63.5, hoehe:38.1, spalten:3, zeilen:7,
    luecke:2.5, lueckeY:0, randX:7.25, randY:15.15 },
  { id:'48x25',  name:'48,5 × 25,4 mm · 40 je Bogen', breite:48.5, hoehe:25.4, spalten:4, zeilen:10,
    luecke:2.5, lueckeY:0, randX:4.25, randY:21.5 },
  { id:'105x48', name:'105 × 48 mm · 12 je Bogen',    breite:105,  hoehe:48,   spalten:2, zeilen:6,
    luecke:0,   lueckeY:0 },
  { id:'eigen',  name:'Eigenes Format (selbst ausmessen)', eigen:true }
];
function etikettFormat(){
  const d = druckEinstellungen();
  const f = formatFinden(ETIKETT_FORMATE, d.etikett);
  if (!f.eigen) return f;
  const e = d.eigenes || (d.eigenes = { breite:70, hoehe:37, spalten:3, zeilen:8, luecke:0, lueckeY:0, randX:0, randY:0 });
  return { id:'eigen', name:'Eigenes Format · '+e.breite+' × '+e.hoehe+' mm · '+(e.spalten*e.zeilen)+' je Bogen',
           breite:+e.breite, hoehe:+e.hoehe, spalten:+e.spalten, zeilen:+e.zeilen,
           luecke:+e.luecke, lueckeY:+e.lueckeY, randX:+e.randX, randY:+e.randY, eigen:true };
}

var KARTEN_FORMATE = [
  { id:'scheck', name:'Scheckkarte stehend 54 × 85,6 mm · 9 je Bogen', breite:54,  hoehe:85.6, spalten:3, zeilen:3 },
  { id:'a7',     name:'A7 stehend 74 × 105 mm · 4 je Bogen',           breite:74,  hoehe:105,  spalten:2, zeilen:2 },
  { id:'a6',     name:'A6 stehend 105 × 148 mm · 4 je Bogen',          breite:105, hoehe:148,  spalten:2, zeilen:2 },
  { id:'quer',   name:'Scheckkarte liegend 85,6 × 54 mm · 10 je Bogen', breite:85.6, hoehe:54, spalten:2, zeilen:5 }
];
function formatFinden(liste, id){ return liste.filter(function(f){ return f.id===id; })[0] || liste[0]; }
function druckEinstellungen(){
  if (!S.org.druck) S.org.druck = { etikett:'70x37', karte:'scheck', offX:0, offY:0, rahmen:true };
  return S.org.druck;
}
/* Bogen aufbauen: Zellen auf Seiten verteilen und in Millimetern setzen */
/* Der Massstab wird fortgeschrieben, nicht neu gesetzt: Ein Pruefbogen wird
   ja bereits mit dem aktuellen Massstab gedruckt. Wer die Linie misst, misst
   das Ergebnis der letzten Einstellung – also gilt
   neuer Massstab = alter Massstab x 100 / gemessen. */
function druckSkala(){
  const d = druckEinstellungen();
  if (d.skala === undefined || d.skala === null){
    /* Alte Einstellung uebernehmen, falls vorhanden */
    d.skala = d.gemessen ? 100 / d.gemessen : 1;
    delete d.gemessen;
  }
  const k = +d.skala || 1;
  return (k >= 0.5 && k <= 2) ? k : 1;
}
function massstabNachMessung(gemessen){
  const d = druckEinstellungen();
  const wert = parseFloat(gemessen);
  if (!wert || wert < 40 || wert > 250) return 'Bitte die gemessene Länge in Millimetern eingeben (40 bis 250).';
  const neu = druckSkala() * 100 / wert;
  if (neu < 0.5 || neu > 2) return 'Das ergibt einen unplausiblen Maßstab. Stimmt die Messung?';
  d.skala = neu;
  logAction('Druckmaßstab auf '+Math.round(neu*1000)/10+' % gesetzt');
  save();
  return null;
}
function druckBogen(format, zellen, klasse, vorspann){
  const d = druckEinstellungen();
  const luecke = +format.luecke || 0, lueckeY = +format.lueckeY || 0;
  const breiteGesamt = format.spalten * format.breite + (format.spalten - 1) * luecke;
  const hoeheGesamt  = format.zeilen  * format.hoehe  + (format.zeilen  - 1) * lueckeY;
  const randX = (format.randX != null ? +format.randX : (210 - breiteGesamt) / 2) + (+d.offX || 0);
  const randY = (format.randY != null ? +format.randY : (297 - hoeheGesamt) / 2) + (+d.offY || 0);
  const k = druckSkala();
  const proSeite = format.spalten * format.zeilen;
  const seiten = [];
  for (let i = 0; i < zellen.length; i += proSeite) seiten.push(zellen.slice(i, i + proSeite));
  if (!seiten.length) seiten.push([]);
  /* Der Massstab wird als Transformation gesetzt: sie veraendert die
     Layoutbreite nicht und wirkt deshalb sauber gegen eine Verkleinerung
     durch den Drucker. */
  return seiten.map(seite =>
    '<div class="druckseite">'+
      '<div class="druckskala" style="transform:scale('+k+');transform-origin:top left;'+
        'padding:'+Math.max(0,randY)+'mm 0 0 '+Math.max(0,randX)+'mm">'+
        (vorspann || '')+
        '<div class="druckraster '+klasse+'" style="grid-template-columns:repeat('+format.spalten+','+format.breite+'mm);'+
        'grid-auto-rows:'+format.hoehe+'mm;column-gap:'+luecke+'mm;row-gap:'+lueckeY+'mm">'+
        seite.join('')+'</div>'+
      '</div>'+
    '</div>').join('');
}

/* Pruefbogen: nur die Umrisse und ein Massstab. Auf einfachem Papier drucken
   und gegen den Etikettenbogen halten – so kostet das Ausrichten kein Etikett. */
function pruefBogen(format){
  const zellen = [];
  const anzahl = format.spalten * format.zeilen;
  for (let i = 0; i < anzahl; i++)
    zellen.push('<div class="druckzelle mit-rahmen pruef"><span>'+(i+1)+'</span></div>');
  const kopf = '<div class="pruef-kopf">'+esc(format.name)+' · Etikett '+format.breite+' × '+format.hoehe+' mm'+
    ' · Abstand '+(+format.luecke||0)+' / '+(+format.lueckeY||0)+' mm'+
    ' · Maßstab '+Math.round(druckSkala()*1000)/10+' %'+
    '<div class="pruef-massstab"><span class="pruef-linie"></span>'+
    'Diese Linie soll 100 mm sein. Nachmessen und den gemessenen Wert in KitaBib eintragen.</div></div>';
  return druckBogen(format, zellen, 'etiketten', kopf);
}

function karteZelle(k, format){
  const e = karteEinstellungen();
  const stehend = format.hoehe > format.breite;
  const gross = format.breite >= 100;
  const zeichen = (e.feld === 'symbol' && !istGruppenkonto(k)) ? zeichenFuer(k) : null;
  const feldMm = stehend ? (gross ? 34 : 22) : 18;

  const feldHtml = istGruppenkonto(k) ? ''
    : e.feld === 'aufkleben'
      ? '<div class="az-feld" style="width:'+feldMm+'mm;height:'+feldMm+'mm"><span>Foto</span></div>'
    : e.feld === 'symbol'
      ? '<div class="az-zeichen" style="width:'+feldMm+'mm;height:'+feldMm+'mm;font-size:'+(feldMm*0.62)+'mm">'+zeichen+'</div>'
      : '';

  const gk = istGruppenkonto(k);
  const textHtml = gk
    ? ((e.kita ? '<div class="az-kopf">Bibliotheksausweis · '+esc(S.org.name)+'</div>' : '<div class="az-kopf">Bibliotheksausweis</div>')+
       '<div class="az-name" style="font-size:'+(gross?24:16)+'pt">'+esc(k.name)+'</div>'+
       '<div class="az-gruppe">Gruppenkonto</div>')
    : ((e.kita ? '<div class="az-kopf">Bibliotheksausweis · '+esc(S.org.name)+'</div>' : '<div class="az-kopf">Bibliotheksausweis</div>')+
       (e.vorname ? '<div class="az-name" style="font-size:'+(gross?24:16)+'pt">'+esc(k.name)+'</div>' : '')+
       (e.gruppe ? '<div class="az-gruppe">'+esc(groupName(k.groupId))+'</div>' : ''));

  if (!stehend){
    return '<div class="druckzelle'+(druckEinstellungen().rahmen?' mit-rahmen':'')+'">'+
      '<div class="dz-qr" style="width:34mm">'+qrSVG(k.token)+'</div>'+
      '<div class="dz-text">'+
        (e.vorname ? '<div class="dz-name" style="font-size:15pt">'+esc(k.name)+'</div>' : '')+
        (e.gruppe ? '<div class="dz-klein">'+esc(groupName(k.groupId))+'</div>' : '')+
        (e.kita ? '<div class="dz-org">'+esc(S.org.name)+'</div>' : '')+
      '</div>'+ (feldHtml ? '<div class="dz-feld">'+feldHtml+'</div>' : '') +'</div>';
  }
  /* Stehend: Kopfblock oben, darunter der Code über die volle Breite */
  const kopfhoehe = Math.max(gross ? 30 : 21, feldHtml ? feldMm + 3 : 0);
  const qr = Math.min(format.breite - 9, format.hoehe - 9 - kopfhoehe);
  return '<div class="druckzelle ausweis'+(druckEinstellungen().rahmen?' mit-rahmen':'')+'">'+
    '<div class="az-oben">'+
      '<div class="az-text">'+textHtml+'</div>'+
      feldHtml+
    '</div>'+
    '<div class="az-qr" style="width:'+qr.toFixed(1)+'mm">'+qrSVG(k.token)+'</div>'+
  '</div>';
}

function etikettZelle(c, format){
  var t = title(c.titleId), klein = format.hoehe < 30;
  var qrGroesse = Math.min(format.hoehe - 6, klein ? 18 : 26);
  return '<div class="druckzelle'+(druckEinstellungen().rahmen?' mit-rahmen':'')+'">'+
    '<div class="dz-qr" style="width:'+qrGroesse+'mm">'+qrSVG(c.token)+'</div>'+
    '<div class="dz-text">'+
      '<div class="dz-inv">'+esc(c.inv)+'</div>'+
      (klein ? '' : '<div class="dz-klein">'+esc(t.title.length>28 ? t.title.slice(0,26)+'…' : t.title)+'</div>')+
    '</div></div>';
}

<script>
/* ================================================ Bestand uebernehmen =====
   Drei Wege in den eigenen Bestand: ISBN-Liste (Daten kommen von der DNB),
   Tabelle fuer Buecher ohne ISBN, und eine vollstaendige Sicherung.
   ======================================================================== */
var FASSUNG = '31.08.2026 · 15';
var bestand = { isbnText:'', isbnLauf:null, isbnErgebnis:null, tabText:'', tabErgebnis:null, sicherung:null };

function isbnListeLesen(text){
  return text.split(/[\s,;]+/).map(function (t) { return Buchdaten.normIsbn(t); })
             .filter(function (t) { return t.length === 13 || t.length === 10; });
}
function isbnListeAbfragen(){
  var liste = isbnListeLesen(bestand.isbnText);
  if (!liste.length){ toast('Keine gültige ISBN gefunden.'); return; }
  bestand.isbnLauf = { gesamt: liste.length, fertig: 0 };
  bestand.isbnErgebnis = [];
  render();
  var i = 0;
  function naechste(){
    if (i >= liste.length){
      bestand.isbnLauf = null;
      render();
      return;
    }
    var isbn = liste[i++];
    var vorhanden = S.titles.filter(function (t) { return Buchdaten.normIsbn(t.isbn) === isbn; })[0];
    if (vorhanden){
      bestand.isbnErgebnis.push({ isbn: isbn, art:'dublette', titel: vorhanden.title, id: vorhanden.id });
      bestand.isbnLauf.fertig++;
      render();
      setTimeout(naechste, 0);
      return;
    }
    Buchdaten.suche(isbn).then(function (treffer){
      bestand.isbnErgebnis.push(treffer
        ? { isbn: isbn, art:'gefunden', daten: treffer }
        : { isbn: isbn, art:'ohne', titel: null });
      bestand.isbnLauf.fertig++;
      render();
      setTimeout(naechste, 400);          // die DNB nicht überrennen
    });
  }
  naechste();
}
function isbnListeUebernehmen(){
  var neuAngelegt = 0, zusatz = 0;
  bestand.isbnErgebnis.forEach(function (e){
    if (e.art === 'gefunden'){
      var d = e.daten;
      var idx = S.titles.length + 1;
      var id = uid('t');
      S.titles.push({ id:id, title:d.title||'Ohne Titel', subtitle:d.subtitle||'', author:d.author||'Unbekannt',
        illustrator:d.illustrator||'', publisher:d.publisher||'', year:+d.year||new Date().getFullYear(),
        ageMin:3, ageMax:6, cats:[], blurb:d.blurb||'', isbn:d.isbn||Buchdaten.formatIsbn(e.isbn),
        lang:'Deutsch', coverIdx:(idx-1) % COVER_PALETTE.length, cover:null });
      S.copies.push({ id:uid('c'), titleId:id, inv:'B-'+String(idx).padStart(3,'0')+'-1',
        status:'available', token:newToken('B'), etikettAm:null });
      neuAngelegt++;
    } else if (e.art === 'dublette'){
      addCopyTo(e.id); zusatz++;
    }
  });
  logAction('ISBN-Liste übernommen: '+neuAngelegt+' neue Titel, '+zusatz+' zusätzliche Exemplare');
  save();
  bestand.isbnErgebnis = null; bestand.isbnText = '';
  render();
  toast(neuAngelegt+' Titel angelegt · '+zusatz+' Exemplare ergänzt. Etiketten nicht vergessen.');
}

/* Tabelle fuer Buecher ohne ISBN: Titel;Autor;Alter von;Alter bis;Themen;Exemplare */
function tabelleLesen(text){
  var out = { neu:[], fehler:[] };
  text.split(/\r?\n/).map(function (z){ return z.trim(); }).filter(Boolean).forEach(function (zeile, i){
    if (i === 0 && /titel/i.test(zeile)) return;
    var p = zeile.split(';').map(function (t){ return t.trim(); });
    if (!p[0]){ out.fehler.push({ zeile: zeile, grund:'Titel fehlt' }); return; }
    var themen = (p[4]||'').split(/[,\/]/).map(function (t){ return t.trim(); })
                  .filter(function (t){ return kategorien().indexOf(t) >= 0; });
    var unbekannt = (p[4]||'').split(/[,\/]/).map(function (t){ return t.trim(); })
                  .filter(function (t){ return t && kategorien().indexOf(t) < 0; });
    out.neu.push({ titel:p[0], autor:p[1]||'Unbekannt', von:parseInt(p[2],10)||3, bis:parseInt(p[3],10)||6,
                   themen:themen, unbekannteThemen:unbekannt, exemplare:Math.max(1, parseInt(p[5],10)||1) });
  });
  return out;
}
function tabelleUebernehmen(){
  var titelZahl = 0, exemplare = 0;
  bestand.tabErgebnis.neu.forEach(function (n){
    var idx = S.titles.length + 1, id = uid('t');
    S.titles.push({ id:id, title:n.titel, subtitle:'', author:n.autor, illustrator:'', publisher:'',
      year:new Date().getFullYear(), ageMin:n.von, ageMax:n.bis, cats:n.themen.slice(), blurb:'',
      isbn:'', lang:'Deutsch', coverIdx:(idx-1) % COVER_PALETTE.length, cover:null });
    for (var k = 0; k < n.exemplare; k++){
      S.copies.push({ id:uid('c'), titleId:id, inv:'B-'+String(idx).padStart(3,'0')+'-'+(k+1),
        status:'available', token:newToken('B'), etikettAm:null });
      exemplare++;
    }
    titelZahl++;
  });
  logAction('Tabelle übernommen: '+titelZahl+' Titel, '+exemplare+' Exemplare');
  save();
  bestand.tabErgebnis = null; bestand.tabText = '';
  render();
  toast(titelZahl+' Titel mit '+exemplare+' Exemplaren angelegt.');
}

/* Sicherung */
function sicherungErzeugen(){
  return JSON.stringify({ kitabib:1, stand: todayISO(), daten: S }, null, 1);
}
/* Wann ist eine Sicherung fällig? Erst wenn wirklich gearbeitet wurde –
   ein Hinweis ohne Anlass ist nur Rauschen. */
function sicherungFaellig(){
  const letzte = S.org.letzteSicherung;
  if (!letzte) return S.log.length > 2;
  return daysDiff(letzte, todayISO()) >= 7;
}
function sicherungAlter(){
  const letzte = S.org.letzteSicherung;
  if (!letzte) return null;
  return daysDiff(letzte, todayISO());
}
function sicherungVermerken(){
  S.org.letzteSicherung = todayISO();
  logAction('Sicherung erstellt');
  save();
}
function sicherungDateiname(){
  return 'kitabib-sicherung-' + todayISO() + '.json';
}
/* In einer eingebetteten Ansicht (veroeffentlichtes Artifact) darf eine Seite
   keine Dateien ausliefern – dort waere der Knopf wirkungslos. */
function dateiSpeichernMoeglich(){ return window.self === window.top; }
function sicherungAlsDatei(){
  try {
    const blob = new Blob([sicherungErzeugen()], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = sicherungDateiname();
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
    return true;
  } catch (e) { return false; }
}
function openSicherung(){
  flow = null;
  const inhalt = sicherungErzeugen();
  openSheet({
    title: 'Sicherung',
    body: () => {
      const alter = sicherungAlter();
      return '<div class="card pad stack" style="gap:10px">'+
          '<div><span style="font-weight:700">'+plural(S.titles.length,'Titel','Titel')+' · '+
          plural(S.copies.length,'Exemplar','Exemplare')+' · '+plural(S.children.length,'Kinderkonto','Kinderkonten')+'</span>'+
          '<span class="r-sub" style="display:block">'+
          (alter === null ? 'Bisher wurde nichts gesichert.'
            : alter === 0 ? 'Zuletzt heute gesichert.'
            : 'Zuletzt gesichert vor '+plural(alter,'Tag','Tagen')+' ('+fmtDate(S.org.letzteSicherung)+').')+
          '</span></div></div>'+
        '<div class="notice calm">'+icon('shield')+'<span><span class="n-title">Warum das wichtig ist</span>'+
          '<span class="n-body">Der ganze Bestand liegt in genau diesem Browser. Wird er aufgeräumt oder das Gerät getauscht, ist ohne Sicherung alles weg.</span></span></div>'+
        '<div class="field"><label for="sicherungText">Sicherungstext</label>'+
          '<textarea id="sicherungText" spellcheck="false" readonly>'+esc(inhalt)+'</textarea>'+
          '<p class="hint">'+(dateiSpeichernMoeglich()
            ? 'Kopieren und in eine Textdatei sichern – oder als Datei speichern und auf einen Stick oder in die Cloud legen.'
            : 'Text kopieren und in eine Textdatei sichern. Das Speichern als Datei ist in dieser eingebetteten Ansicht gesperrt; mit der Datei auf eigenem Server oder Rechner steht der Weg zusätzlich offen.')+'</p></div>';
    },
    foot: () => (dateiSpeichernMoeglich()
        ? '<button class="btn" data-act="sicherung-datei">'+icon('printer')+'Als Datei</button>' : '')+
      '<button class="btn btn-primary" style="flex:1" data-act="sicherung-in-ablage">'+icon('card')+'In die Zwischenablage</button>'
  });
}

function sicherungEinlesen(text){
  try {
    var j = JSON.parse(text);
    var d = j && j.daten ? j.daten : j;
    if (!d || !d.titles || !d.children || !d.copies) return 'Die Datei enthält keinen KitaBib-Bestand.';
    S = d;
    if (!S.log) S.log = [];
    save();
    lib = { q:'', avail:false, age:'', cat:'', only:null }; kidFilter = '';
    return null;
  } catch (e) { return 'Die Datei ließ sich nicht lesen: ' + e.message; }
}

<script>
/* ============================================== Neue Fassung erkennen =====
   iOS haelt Web-Apps vom Home-Bildschirm lange im Speicher und laedt die Seite
   von sich aus nicht neu. Ohne diese Pruefung arbeitet ein Geraet wochenlang
   mit einem alten Stand, ohne dass es jemand merkt. Deshalb: beim Start und
   bei jeder Rueckkehr in die App nachsehen, hoechstens einmal je Stunde.
   ======================================================================== */
var neueFassung = null, fassungZuletztGeprueft = 0;
function fassungPruefen(erzwingen){
  if (!erzwingen && fassungZuletztGeprueft && Date.now() - fassungZuletztGeprueft < 3600000) return;
  if (navigator.onLine === false) return;
  fassungZuletztGeprueft = Date.now();
  var ziel = location.pathname + (location.pathname.slice(-1) === '/' ? '' : '') + '?stand=' + Date.now();
  fetch(ziel, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var m = t.match(/var FASSUNG = '([^']+)'/);
      if (m && m[1] !== FASSUNG && m[1] !== neueFassung){
        neueFassung = m[1];
        render();
      }
    })
    .catch(function () { /* offline oder Zugriff nach aussen gesperrt: still bleiben */ });
}
function neueFassungLaden(){
  try { location.replace(location.pathname + '?v=' + Date.now()); }
  catch (e) { location.reload(); }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') fassungPruefen();
});
</script>
<script>
/* ================================================== Tabellen einlesen =====
   Excel-Dateien sind ZIP-Archive mit XML darin. Moderne Browser koennen mit
   DecompressionStream entpacken – damit geht das ohne Fremdbibliothek und
   ohne den Umweg ueber CSV, der bei deutschem Excel regelmaessig an
   Semikolon und Zeichensatz scheitert.
   ======================================================================== */
var Tabelle = {
  xlsxMoeglich: function(){ return typeof DecompressionStream === 'function'; },

  zipEintraege: function (buf) {
    var dv = new DataView(buf), eocd = -1, i;
    for (i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 65558; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Das ist keine Excel-Datei.');
    var anzahl = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true);
    var eintraege = {}, dec = new TextDecoder();
    for (var n = 0; n < anzahl; n++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      var methode = dv.getUint16(off + 10, true);
      var groesse = dv.getUint32(off + 20, true);
      var nameLen = dv.getUint16(off + 28, true);
      var extraLen = dv.getUint16(off + 30, true);
      var kommLen = dv.getUint16(off + 32, true);
      var lokal = dv.getUint32(off + 42, true);
      var name = dec.decode(new Uint8Array(buf, off + 46, nameLen));
      eintraege[name] = { methode: methode, groesse: groesse, lokal: lokal };
      off += 46 + nameLen + extraLen + kommLen;
    }
    return eintraege;
  },

  zipLesen: function (buf, eintrag) {
    var dv = new DataView(buf), off = eintrag.lokal;
    if (dv.getUint32(off, true) !== 0x04034b50) throw new Error('Beschädigte Excel-Datei.');
    var start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    var daten = new Uint8Array(buf, start, eintrag.groesse);
    if (eintrag.methode === 0) return Promise.resolve(new TextDecoder().decode(daten));
    var strom = new Blob([daten]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(strom).text();
  },

  spalte: function (ref) {
    var m = /^([A-Z]+)/.exec(ref || '');
    if (!m) return 0;
    var n = 0;
    for (var i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
    return n - 1;
  },

  ausXlsx: function (buf) {
    var self = this, e;
    try { e = this.zipEintraege(buf); }
    catch (err) { return Promise.reject(err); }
    var blattName = Object.keys(e).filter(function (n) { return /^xl\/worksheets\/sheet1\.xml$/.test(n); })[0]
                 || Object.keys(e).filter(function (n) { return /^xl\/worksheets\/.+\.xml$/.test(n); })[0];
    if (!blattName) return Promise.reject(new Error('In der Datei ist kein Tabellenblatt zu finden.'));
    var texte = [];
    var vorlauf = e['xl/sharedStrings.xml']
      ? this.zipLesen(buf, e['xl/sharedStrings.xml']).then(function (xml) {
          var doc = new DOMParser().parseFromString(xml, 'application/xml');
          var si = doc.getElementsByTagNameNS('*', 'si');
          for (var i = 0; i < si.length; i++) {
            var t = si[i].getElementsByTagNameNS('*', 't'), teil = '';
            for (var j = 0; j < t.length; j++) teil += t[j].textContent;
            texte.push(teil);
          }
        })
      : Promise.resolve();
    return vorlauf.then(function () { return self.zipLesen(buf, e[blattName]); })
      .then(function (xml) {
        var doc = new DOMParser().parseFromString(xml, 'application/xml');
        var rows = doc.getElementsByTagNameNS('*', 'row'), zeilen = [];
        for (var r = 0; r < rows.length; r++) {
          var cs = rows[r].getElementsByTagNameNS('*', 'c'), zeile = [];
          for (var i = 0; i < cs.length; i++) {
            var c = cs[i], typ = c.getAttribute('t'), wert = '';
            if (typ === 'inlineStr') {
              var it = c.getElementsByTagNameNS('*', 't');
              for (var j = 0; j < it.length; j++) wert += it[j].textContent;
            } else {
              var v = c.getElementsByTagNameNS('*', 'v')[0];
              wert = v ? v.textContent : '';
              if (typ === 's') wert = texte[+wert] || '';
            }
            zeile[self.spalte(c.getAttribute('r'))] = wert;
          }
          zeilen.push(zeile);
        }
        return zeilen;
      });
  },

  /* CSV: deutsches Excel schreibt Semikolon und oft Windows-1252 */
  ausCsv: function (buf) {
    var text = new TextDecoder('utf-8').decode(buf);
    if (text.indexOf('\uFFFD') >= 0) {
      try { text = new TextDecoder('windows-1252').decode(buf); } catch (e) {}
    }
    var trenner = (text.split(';').length > text.split(',').length) ? ';' : ',';
    return text.split(/\r?\n/).filter(function (z) { return z.trim(); })
      .map(function (z) { return z.split(trenner).map(function (t) { return t.trim().replace(/^"|"$/g, ''); }); });
  },

  ausDatei: function (datei) {
    var self = this;
    return datei.arrayBuffer().then(function (buf) {
      var kopf = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
      var istZip = kopf[0] === 0x50 && kopf[1] === 0x4b;                 // "PK"
      if (istZip) {
        if (!self.xlsxMoeglich())
          throw new Error('Dieser Browser kann keine Excel-Dateien entpacken. Bitte in Excel als CSV speichern.');
        return self.ausXlsx(buf);
      }
      return self.ausCsv(buf);
    });
  }
};
</script>
<script>
/* ============================================================ Rendering */
const SCREENS = {
  start:screenStart, library:screenLibrary, book:screenBook, scan:screenScan,
  children:screenChildren, child:screenChild, overdue:screenOverdue, more:screenMore,
  settings:screenSettings, groups:screenGroups, cards:screenCards, labels:screenLabels,
  rollover:screenRollover, bestand:screenBestand, stats:screenStats, anleitung:screenAnleitung, kinderimport:screenKinderImport, kategorien:screenKategorien, log:screenLog, privacy:screenPrivacy
};
function withFocus(fn){
  const el = document.activeElement;
  const id = el && el.id;
  const pos = el && typeof el.selectionStart === 'number' ? el.selectionStart : null;
  fn();
  if (id){
    const n = document.getElementById(id);
    if (n && n.focus){
      n.focus();
      if (pos !== null && n.setSelectionRange){ try { n.setSelectionRange(pos, pos); } catch(e){} }
    }
  }
}
function render(){
  withFocus(() => {
    $('#view').innerHTML = (SCREENS[route.name] || screenStart)();
    renderNav();
    $('#orgName').textContent = S.org.name;
    $('#todayLabel').textContent = fmtDate(todayISO());
  });
}
function rerenderSheet(){ withFocus(renderSheet); }

let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;'+
      'background:var(--ink);color:#FBF9F5;padding:14px 20px;border-radius:999px;font-weight:700;'+
      'font-size:14.5px;box-shadow:var(--shadow-lift);max-width:min(520px,92vw);text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3400);
}

/* --------------------------------------------------------------- Druck */
/* Der Druckbogen bleibt stehen, bis der Nutzer weiterarbeitet.
   Jede Zeitsteuerung ist hier falsch: Auf dem iPad erzeugt Safari das
   Druckbild irgendwann nach dem Aufruf – teils erst, wenn in der Vorschau
   geblättert wird. Wird der Modus vorher abgeschaltet, landet die ganze
   Oberflaeche auf dem Papier. Auf dem Bildschirm stoert der stehengebliebene
   Bogen nicht, er ist dort ohnehin ausgeblendet. */
function druckModusBeenden(){
  document.body.classList.remove('printing-sheet');
  var host = document.getElementById('printHost');
  if (host) host.innerHTML = '';
}
/* Wird der Inhalt vergroessert, muss die Seite mitwachsen – sonst schneidet
   der Seitenrahmen ab, was ueber 210 mm hinausragt. Die vergroesserte Seite
   wird vom Geraet wieder auf das Papier verkleinert; unterm Strich steht der
   Inhalt in wahrer Groesse und vollstaendig auf dem Blatt. */
function seitenmassSetzen(){
  const k = druckSkala();
  const b = (210 * k).toFixed(2), h = (297 * k).toFixed(2);
  let st = document.getElementById('seitenmass');
  if (!st){ st = document.createElement('style'); st.id = 'seitenmass'; document.head.appendChild(st); }
  st.textContent = '@media print{'+
    '@page{size:'+b+'mm '+h+'mm; margin:0}'+
    'html,body{width:'+b+'mm !important; max-width:'+b+'mm !important}'+
    '.druckseite{width:'+b+'mm !important; height:'+h+'mm !important}'+
  '}';
}
function doPrint(html){
  druckModusBeenden();
  seitenmassSetzen();
  $('#printHost').innerHTML = html;
  document.body.classList.add('printing-sheet');
  let printed = false;
  try { window.print(); printed = true; } catch (e) { printed = false; }
  if (!printed) toast('Druck ist in dieser Ansicht gesperrt – Seite in einem eigenen Tab öffnen und dort drucken.');
}

function druckHinweis(){
  toast('Im Druckdialog „Tatsächliche Größe" bzw. 100 % wählen – nicht „An Seite anpassen".');
}
function printCards(list){
  const format = formatFinden(KARTEN_FORMATE, druckEinstellungen().karte);
  doPrint(druckBogen(format, list.map(k => karteZelle(k, format)), 'karten'));
  druckHinweis();
}
function ohneEtikett(){ return S.copies.filter(c => !c.etikettAm && c.status !== 'retired'); }
function printLabels(list){
  const format = etikettFormat();
  doPrint(druckBogen(format, list.map(c => etikettZelle(c, format)), 'etiketten'));
  /* Gedruckte Etiketten vermerken, damit der Hinweis auf fehlende verschwindet
     und beim nächsten Mal nur die neuen auf den Bogen kommen. */
  const heute = todayISO();
  list.forEach(c => { const e = copy(c.id); if (e) e.etikettAm = heute; });
  save();
  druckHinweis();
}

/* ======================================================== Interaktionen */
function scanChildToken(tok){
  if (scanBlocked(tok)){ flow.msg = { kind:'warn', text:'Dieser Code wurde gerade eben schon erfasst.' }; return rerenderSheet(); }
  const k = childByToken(tok);
  if (!k){ flow.msg = { kind:'err', text:'Unbekannte Karte. Bitte im Backend prüfen oder Kind manuell suchen.' }; return rerenderSheet(); }
  if (!k.active){ flow.msg = { kind:'err', text:k.name+' hat ein inaktives Bibliothekskonto.' }; return rerenderSheet(); }
  flow.childId = k.id; flow.step = 'books'; flow.msg = null;
  rerenderSheet();
}
function scanCopyForLoan(tok){
  if (scanBlocked(tok)){ flow.msg = { kind:'warn', text:'Dieser Code wurde gerade eben schon erfasst.' }; return rerenderSheet(); }
  const c = copyByToken(tok);
  if (!c){ flow.msg = { kind:'err', text:'Unbekanntes Etikett. Buch zuerst erfassen.' }; return rerenderSheet(); }
  if (flow.copyIds.includes(c.id)){ flow.msg = { kind:'warn', text:'Dieses Exemplar steht schon auf der Liste.' }; return rerenderSheet(); }
  if (c.status === 'loaned'){
    const l = loanOfCopy(c.id);
    flow.msg = { kind:'err', text:'Bereits ausgeliehen an '+(l ? child(l.childId).name : 'ein anderes Kind')+'.' };
    return rerenderSheet();
  }
  if (c.status !== 'available'){
    flow.msg = { kind:'err', text:'Exemplar ist als "'+STATUS[c.status].label+'" markiert und nicht ausleihbar.' };
    return rerenderSheet();
  }
  const open = loansOfChild(flow.childId).length + flow.copyIds.length;
  if (open >= grenzeFuer(child(flow.childId))){
    flow.msg = { kind:'warn', text:'Grenze erreicht: höchstens '+grenzeText(child(flow.childId))+'.' };
    return rerenderSheet();
  }
  flow.copyIds.push(c.id); flow.msg = null;
  rerenderSheet();
}
function confirmLoan(){
  const k = child(flow.childId);
  const t = todayISO(), due = addDays(t, leihdauerFuer(k));
  flow.copyIds.forEach(cid => {
    copy(cid).status = 'loaned';
    S.loans.push({ id:uid('l'), copyId:cid, childId:flow.childId, start:t, due, returnedAt:null });
  });
  logAction(plural(flow.copyIds.length,'Buch','Bücher')+' an '+child(flow.childId).name+' ausgeliehen');
  save();
  flow.step = 'done';
  rerenderSheet();
}
function scanCopyForReturn(tok){
  if (scanBlocked(tok)){ flow.msg = { kind:'warn', text:'Dieser Code wurde gerade eben schon erfasst.' }; return rerenderSheet(); }
  const c = copyByToken(tok);
  if (!c){ flow.msg = { kind:'err', text:'Unbekanntes Etikett.' }; return rerenderSheet(); }
  const l = loanOfCopy(c.id);
  if (!l){
    flow.msg = { kind:'warn', text:'"'+title(c.titleId).title+'" ist nicht ausgeliehen ('+STATUS[c.status].label+').' };
    return rerenderSheet();
  }
  flow.msg = null;
  if (flow.quick){ finishReturn(c.id, false); return; }
  flow.pending = { copyId:c.id, loan:l };
  rerenderSheet();
}
function finishReturn(copyId, damaged){
  const l = loanOfCopy(copyId), c = copy(copyId), t = title(c.titleId), k = child(l.childId);
  l.returnedAt = todayISO();
  c.status = damaged ? 'damaged' : 'available';
  flow.done.unshift({ title:t.title, childName:k.name, damaged:!!damaged });
  flow.pending = null;
  flow.msg = damaged ? { kind:'warn', text:'"'+t.title+'" liegt zur Prüfung – nicht im Regal.' } : null;
  if (damaged) logAction('"'+t.title+'" ('+c.inv+') zur Prüfung markiert');
  save();
  rerenderSheet();
}
/* ISBN erkannt: erst Dublette pruefen, dann Buchdaten abrufen */
function scanISBN(code){
  const rein = Buchdaten.normIsbn(code);
  if (scanBlocked(rein)) return;
  const vorhanden = S.titles.find(t => Buchdaten.normIsbn(t.isbn) === rein);
  if (vorhanden){
    flow.dupTitleId = vorhanden.id; flow.step = 'duplicate'; flow.msg = null;
    return rerenderSheet();
  }
  flow.isbn = Buchdaten.formatIsbn(rein);
  flow.step = 'suche';
  flow.msg = null;
  rerenderSheet();
  Buchdaten.suche(rein).then(treffer => {
    if (!flow || flow.type !== 'add' || flow.step !== 'suche') return;   // Vorgang inzwischen beendet
    if (!treffer){
      flow.draft = Object.assign(emptyDraft(), { isbn: Buchdaten.formatIsbn(rein) });
      flow.step = 'manual';
      flow.msg = { kind:'warn', text: Buchdaten.netzGesperrt
        ? 'Kein Zugriff auf die Buchdatenbank – in der veröffentlichten Ansicht ist der Zugriff nach außen gesperrt. Bitte von Hand eintragen (in der lokalen Datei funktioniert die Abfrage).'
        : 'Zu dieser ISBN wurden keine Daten gefunden – bitte von Hand eintragen.' };
      return rerenderSheet();
    }
    flow.draft = Object.assign(emptyDraft(), treffer, { cats: treffer.cats ? treffer.cats.slice() : [] });
    flow.step = 'proposal';
    rerenderSheet();
  });
}

function saveBook(){
  const d = flow.draft;
  if (!d.title || !d.title.trim()){ toast('Ein Titel wird gebraucht.'); return; }
  const id = uid('t');
  const idx = S.titles.length + 1;
  S.titles.push({
    id, title:d.title.trim(), subtitle:d.subtitle||'', author:d.author||'Unbekannt', illustrator:d.illustrator||'',
    publisher:d.publisher||'', year:+d.year || new Date().getFullYear(), ageMin:+d.ageMin||3, ageMax:+d.ageMax||6,
    cats:d.cats.slice(), blurb:d.blurb||'', isbn:d.isbn||'', lang:d.lang||'Deutsch',
    coverIdx:(idx-1) % COVER_PALETTE.length, cover: flow.foto || null
  });
  const c = { id:uid('c'), titleId:id, inv:'B-'+String(idx).padStart(3,'0')+'-1', status:'available', token:newToken('B'), etikettAm:null };
  S.copies.push(c);
  logAction('Neuer Titel "'+d.title.trim()+'" mit Exemplar '+c.inv+' angelegt');
  save();
  flow.newTitleId = id; flow.newCopyId = c.id; flow.step = 'done';
  rerenderSheet();
}
function addCopyTo(titleId){
  const t = title(titleId);
  const n = copiesOfTitle(titleId).length + 1;
  const base = t.id.startsWith('t') && /^t\d+$/.test(t.id) ? t.id.slice(1) : String(S.titles.indexOf(t)+1);
  const c = { id:uid('c'), titleId, inv:'B-'+String(base).padStart(3,'0')+'-'+n, status:'available', token:newToken('B'), etikettAm:null };
  S.copies.push(c);
  logAction('Weiteres Exemplar '+c.inv+' für "'+t.title+'" angelegt');
  save();
  return c;
}

<script>

const ACTIONS = {

  'return-damaged': () => finishReturn(flow.pending.copyId, true),
  'add-isbn': () => { flow.source='isbn'; flow.step='scanning'; rerenderSheet(); },
  'add-cover': () => { flow.source='cover'; flow.step='foto'; flow.msg=null; rerenderSheet(); },
  'foto-aufnehmen': () => {
    const bild = Kamera.standbild(360);
    if (!bild){ toast('Kein Kamerabild – ohne Kamera bitte „Manuell eingeben" wählen.'); return; }
    flow.foto = bild;
    flow.draft = emptyDraft();
    flow.step = 'manual';
    flow.msg = null;
    rerenderSheet();
  },
  'isbn-suchen': () => {
    const feld = document.getElementById('isbnManuell');
    const roh = feld ? feld.value : '';
    const rein = Buchdaten.normIsbn(roh);
    if (rein.length !== 13 && rein.length !== 10){ flow.msg = { kind:'err', text:'Bitte eine 13- oder 10-stellige ISBN eingeben.' }; return rerenderSheet(); }

  },
  'add-manual': () => { flow.source='manual'; flow.draft=emptyDraft(); flow.step='manual'; rerenderSheet(); },
  'add-back': () => {
    if (flow.step==='scanning' || flow.step==='manual' || flow.step==='foto' || flow.step==='suche') flow.step='choose';
    else if (flow.step==='duplicate') flow.step='scanning';
    else flow.step='scanning';

    rerenderSheet();
  },
  'add-copy-only': () => {
    const c = addCopyTo(flow.dupTitleId);
    flow.newTitleId = flow.dupTitleId; flow.newCopyId = c.id; flow.step='done';
    rerenderSheet();
  },
  'save-book': () => saveBook(),

  'etikett-spaeter': () => { closeSheet(); go('labels'); },

  'add-group': () => askText({ title:'Gruppe anlegen', label:'Name der Gruppe', ok:'Anlegen' }, name => {
    S.groups.push({ id:uid('g'), name });

    save(); render(); toast('Gruppe "'+name+'" angelegt.');
  }),
  'reset': () => askConfirm({ title:'Demo-Daten zurücksetzen',
      body:'Alle Änderungen in diesem Browser werden verworfen und der Beispielbestand neu aufgebaut.',
      ok:'Zurücksetzen', danger:true }, () => {
    resetData(); lib = { q:'', avail:false, age:'', cat:'', only:null }; kidFilter=''; roll={csv:null,analysis:null,result:null};
    go('start'); toast('Demo-Daten wiederhergestellt.');
  }),
  'dlg-cancel': () => closeDialog(),
  'dlg-ok': () => {
    const input = document.getElementById('dlgInput');

  'isbn-abfragen': () => isbnListeAbfragen(),

  'isbn-verwerfen': () => { bestand.isbnErgebnis = null; render(); },
  'tab-pruefen': () => {

    if (!e.neu.length && !e.fehler.length){ toast('Keine Zeilen gefunden.'); return; }

  'tab-verwerfen': () => { bestand.tabErgebnis = null; render(); },
  'fassung-laden': () => neueFassungLaden(),
  'import-verwerfen': () => {
    kinderImport = { zeilen:null, datei:'', kopfzeile:true, spalteName:0, spalteKennung:-1, spalteGruppe:-1,
                     ziel:'neu', neueGruppe:'', fehler:null };
    render();
  },
  'import-kopfzeile': () => { kinderImport.kopfzeile = !kinderImport.kopfzeile; render(); },
  'import-uebernehmen': () => {
    const a = importAnalyse();
    askConfirm({ title:'Kinder anlegen',

      ok:'Anlegen' }, () => importUebernehmen());

  'sicherung-oeffnen': () => openSicherung(),
  'sicherung-datei': () => {
    if (!dateiSpeichernMoeglich()){
      toast('In dieser eingebetteten Ansicht ist das Speichern von Dateien gesperrt – bitte den Text kopieren.');
      return;

    if (sicherungAlsDatei()){

      toast('Speichern nicht möglich – bitte den Text oben kopieren.');

    const text = sicherungErzeugen();

      navigator.clipboard.writeText(text).then(() => {

  'loan-for-child': () => {
    const id = route.id;
    flow = { type:'loan', step:'books', childId:id, copyIds:[], msg:null };
    openSheet({ title:'Ausleihen', body:loanBody, foot:loanFoot });
