document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-nav],[data-go],[data-title],[data-child],[data-cat],[data-group],'+
    '[data-scan-child],[data-pick-child],[data-scan-copy],[data-unpick],[data-scan-return],[data-lookup],'+
    '[data-extend],[data-lost-card],[data-print-card],[data-toggle-active],[data-rename-group],'+
    '[data-label-copy],[data-add-copy],[data-draft-cat],[data-backdrop],[data-dlg-backdrop],'+
    '[data-dlg-wahl],[data-copy-status],[data-anonymisieren],[data-rolle],[data-pick-copy],[data-pick-return],'+
    '[data-karte],[data-kartenfeld],[data-zeichen-aendern],[data-zeichen-waehlen],[data-etikett-filter],'+
    '[data-gruppenkonto],[data-gruppenkonto-weg],[data-import-ziel],[data-kat-umbenennen],[data-kat-loeschen]');
  if (!el) return;
  const d = el.dataset;

  if (d.dlgWahl){ const cb = dialogCb; closeDialog(); if (cb) cb(d.dlgWahl); return; }
  if (el.hasAttribute('data-dlg-backdrop') && ev.target === el){ closeDialog(); return; }
  if (el.hasAttribute('data-backdrop') && ev.target === el){ closeSheet(); return; }
  if (d.act && ACTIONS[d.act]){ ACTIONS[d.act](); return; }
  if (d.nav){ if (sheet) { sheet=null; flow=null; $('#sheetHost').innerHTML=''; document.body.style.overflow=''; } go(d.nav); return; }
  if (d.go){
    if (sheet){ sheet=null; flow=null; $('#sheetHost').innerHTML=''; document.body.style.overflow=''; }
    if (d.go === 'damaged'){ lib = { q:'', avail:false, age:'', cat:'', only:'damaged' }; go('library'); return; }
    go(d.go); return;
  }
  if (d.title){ go('book', d.title); return; }
  if (d.child){ go('child', d.child); return; }
  if (d.karte){
    const e = karteEinstellungen();
    e[d.karte] = !e[d.karte];
    save(); render();
    return;
  }
  if (d.kartenfeld){
    const e = karteEinstellungen();
    e.feld = d.kartenfeld;
    if (e.feld === 'symbol') S.children.forEach(k => { if (k.active) zeichenFuer(k); });
    save(); render();
    return;
  }
  if (d.katUmbenennen){
    const alt = d.katUmbenennen;
    askText({ title:'Kategorie umbenennen', label:'Neuer Name', value:alt, ok:'Umbenennen' }, neu => {
      const fehler = kategorieUmbenennen(alt, neu);
      if (fehler){ toast(fehler); return; }
      render();
      toast('Umbenannt – die Bücher behalten das Schlagwort.');
    });
    return;
  }
  if (d.katLoeschen){
    const name = d.katLoeschen;
    const n = kategorieBenutzt(name);
    askConfirm({ title:'Kategorie entfernen',
      body: n ? '„'+name+'" wird bei '+plural(n,'Buch','Büchern')+' entfernt. Die Bücher selbst bleiben erhalten.'
              : '„'+name+'" wird entfernt. Kein Buch trägt dieses Schlagwort.',
      ok:'Entfernen', danger:true }, () => {
      kategorieLoeschen(name);
      render();
      toast('Kategorie entfernt.');
    });
    return;
  }
  if (d.importZiel){
    kinderImport.ziel = d.importZiel;
    render();
    if (d.importZiel === 'neu') setTimeout(() => { const f = document.getElementById('neueGruppeFeld'); if (f) f.focus(); }, 50);
    return;
  }
  if (d.gruppenkonto){
    const g = group(d.gruppenkonto);
    if (!g) return;
    if (gruppenkontoVon(g.id)){ toast('Diese Gruppe hat schon ein Konto.'); return; }
    const k = gruppenkontoAnlegen(g);
    go('child', k.id);
    toast('Gruppenkonto angelegt – Karte drucken und in den Gruppenordner legen.');
    return;
  }
  if (d.gruppenkontoWeg){
    const k = child(d.gruppenkontoWeg);
    if (!k) return;
    if (loansOfChild(k.id).length){ toast('Erst die Bücher zurücknehmen.'); return; }
    askConfirm({ title:'Gruppenkonto entfernen',
      body:'Das Konto von '+k.name+' wird gelöscht. Die Bücher der Gruppe bleiben im Bestand.',
      ok:'Entfernen', danger:true }, () => {
      S.children = S.children.filter(x => x.id !== k.id);
      logAction('Gruppenkonto „'+k.name+'" entfernt');
      save(); go('groups');
      toast('Gruppenkonto entfernt.');
    });
    return;
  }
  if (d.etikettFilter){ etikettFilter = d.etikettFilter; render(); return; }
  if (d.rolle){
    S.rolle = d.rolle; save();
    if (!istAdmin() && ['settings','groups','rollover','bestand','stats','log'].includes(route.name)) go('more');
    else render();
    toast(istAdmin() ? 'Ansicht der Verwaltung.' : 'Ansicht für Mitarbeitende – Verwaltung ausgeblendet.');
    return;
  }
  if (d.cat !== undefined && el.hasAttribute('data-cat')){ lib.cat = d.cat; render(); return; }
  if (d.group !== undefined && el.hasAttribute('data-group')){ kidFilter = d.group; render(); return; }
  if (d.scanChild){ scanChildToken(d.scanChild); return; }
  if (d.pickChild){ flow.childId = d.pickChild; flow.step='books'; flow.msg=null; rerenderSheet(); return; }
  if (d.scanCopy){ scanCopyForLoan(d.scanCopy); return; }
  if (d.pickCopy){
    const c = copy(d.pickCopy);
    if (!c) return;
    const offen = loansOfChild(flow.childId).length + flow.copyIds.length;
    if (offen >= grenzeFuer(child(flow.childId))){
      flow.step = 'books';
      flow.msg = { kind:'warn', text:'Grenze erreicht: höchstens '+grenzeText(child(flow.childId))+'.' };
      rerenderSheet(); return;
    }
    flow.copyIds.push(c.id);
    flow.step = 'books';
    flow.msg = { kind:'ok', text:'"'+title(c.titleId).title+'" ohne Scan hinzugefügt.' };
    rerenderSheet();
    return;
  }
  if (d.pickReturn){
    const c = copy(d.pickReturn);
    const l = c && loanOfCopy(c.id);
    if (!l) { toast('Diese Ausleihe gibt es nicht mehr.'); return; }
    flow.suche = false;
    if (flow.quick){ finishReturn(c.id, false); return; }
    flow.pending = { copyId: c.id, loan: l };
    flow.msg = null;
    rerenderSheet();
    return;
  }
  if (d.unpick){ flow.copyIds = flow.copyIds.filter(x => x !== d.unpick); flow.msg=null; rerenderSheet(); return; }
  if (d.scanReturn){ scanCopyForReturn(d.scanReturn); return; }
  if (d.lookup !== undefined){
    if (d.lookup === 'dup'){ flow.dupTitleId = S.titles[0].id; flow.step='duplicate'; }
    else {
      const b = LOOKUP[+d.lookup];
      const exists = S.titles.find(t => t.isbn === b.isbn || t.title.toLowerCase() === b.title.toLowerCase());
      if (exists){ flow.dupTitleId = exists.id; flow.step='duplicate'; }
      else {
        flow.draft = Object.assign({}, b, { cats:b.cats.slice(), lang:'Deutsch', subtitle:'', quelle:'demo' });
        flow.step = 'proposal';
      }
    }
    rerenderSheet(); return;
  }
  if (d.extend){
    const l = S.loans.find(x => x.id === d.extend);
    if (l){ l.due = addDays(todayISO(), leihdauerFuer(child(l.childId)));
      logAction('Ausleihe von '+child(l.childId).name+' bis '+fmtDate(l.due)+' verlängert');
      save(); render(); toast('Verlängert bis '+fmtDate(l.due)+'.'); }
    return;
  }
  if (d.lostCard){
    const k = child(d.lostCard);
    if (!k) return;
    askConfirm({ title:'Karte von '+k.name+' ersetzen',
      body:'Der alte QR-Code wird gesperrt und ein neuer erzeugt. Bibliothekskonto und laufende Ausleihen bleiben unverändert.',
      ok:'Neue Karte erzeugen' }, () => {
      k.token = newToken('K');
      logAction('Bibliothekskarte für '+k.name+' neu erzeugt (Karte verloren)');
      save(); render(); toast('Neue Karte erzeugt – die alte ist gesperrt.');
    });
    return;
  }
  if (d.printCard){ const k = child(d.printCard); if (k) printCards([k]); return; }
  if (d.toggleActive){
    const k = child(d.toggleActive);
    if (!k) return;
    const offen = loansOfChild(k.id).length;
    if (k.active && offen){
      toast(offen === 1 ? 'Erst die offene Ausleihe zurücknehmen.' : 'Erst die '+offen+' offenen Ausleihen zurücknehmen.');
      return;
    }
    k.active = !k.active;
    logAction('Konto von '+k.name+(k.active?' aktiviert':' deaktiviert'));
    save(); render();
    return;
  }
  if (d.renameGroup){
    const g = group(d.renameGroup);
    if (!g) return;
    askText({ title:'Gruppe umbenennen', label:'Name der Gruppe', value:g.name, ok:'Umbenennen' }, name => {
      const before = g.name; g.name = name;
      logAction('Gruppe "'+before+'" umbenannt in "'+name+'"');
      save(); render();
    });
    return;
  }
  if (d.copyStatus){
    const c = copy(d.copyStatus);
    if (!c) return;
    if (loanOfCopy(c.id)){ toast('Das Exemplar ist ausgeliehen – erst zurücknehmen.'); return; }
    const t = title(c.titleId);
    askAuswahl({
      title: 'Exemplar '+c.inv,
      body: t.title+' · jetzt: '+STATUS[c.status].label,
      optionen: [
        { id:'available', label:'Zurück ins Regal', beschreibung:'Geprüft, wieder ausleihbar', stil:'available' },
        { id:'damaged',   label:'Prüfung erforderlich', beschreibung:'Beschädigt, vorerst nicht ausleihbar', stil:'damaged' },
        { id:'lost',      label:'Als verloren melden', beschreibung:'Bleibt im Bestand, aber nicht ausleihbar', stil:'overdue', nurAdmin:true },
        { id:'retired',   label:'Aussondern', beschreibung:'Endgültig aus dem Bestand genommen', stil:'retired', nurAdmin:true }
      ].filter(o => o.id !== c.status && (istAdmin() || !o.nurAdmin))
    }, wahl => {
      const vorher = STATUS[c.status].label;
      c.status = wahl;
      logAction('Exemplar '+c.inv+' ("'+t.title+'") von "'+vorher+'" auf "'+STATUS[wahl].label+'" gesetzt');
      save(); render();
      toast('Exemplar '+c.inv+': '+STATUS[wahl].label+'.');
    });
    return;
  }
  if (d.anonymisieren){
    const k = child(d.anonymisieren);
    if (!k) return;
    if (loansOfChild(k.id).length){ toast('Erst die offenen Bücher zurücknehmen.'); return; }
    askConfirm({ title:'Personendaten löschen',
      body:'Vorname, Gruppe und Kartenkennung von '+k.name+' werden gelöscht. Die Ausleihzahlen bleiben ohne Personenbezug in der Statistik erhalten. Das lässt sich nicht rückgängig machen.',
      ok:'Endgültig löschen', danger:true }, () => {
      const nummer = S.children.filter(x => x.anonym).length + 1;
      k.name = 'Gelöschtes Konto ' + nummer;
      k.anonym = true; k.active = false; k.token = null;
      k.groupId = null; k.importKey = null; k.familyId = null;
      logAction('Personendaten eines ausgeschiedenen Kontos gelöscht (Konto '+nummer+')');
      save(); go('children');
      toast('Personendaten gelöscht – die Statistik bleibt ohne Personenbezug erhalten.');
    });
    return;
  }
  if (d.zeichenAendern){
    const k = child(d.zeichenAendern);
    if (!k) return;
    openSheet({
      title: 'Zeichen für '+k.name,
      body: () => {
        const belegt = S.children.filter(x => x.id !== k.id && x.zeichen).map(x => x.zeichen);
        return '<p class="hint">Ein Zeichen, das das Kind wiedererkennt. Bereits vergebene sind ausgegraut – die Karten liegen meist zusammen in einer Kiste.</p>'+
          '<div class="zeichen-gitter">'+ZEICHEN.map(z =>
            '<button class="zeichen-knopf'+(z===k.zeichen?' gewaehlt':'')+(belegt.indexOf(z)>=0?' belegt':'')+'" '+
            'data-zeichen-waehlen="'+z+'" data-zeichen-kind="'+k.id+'">'+z+'</button>').join('')+'</div>';
      },
      foot: () => '<button class="btn btn-block" data-act="close-sheet">Schließen</button>'
    });
    return;
  }
  if (d.zeichenWaehlen){
    const k = child(d.zeichenKind);
    if (k){
      k.zeichen = d.zeichenWaehlen;
      logAction('Zeichen für '+k.name+' geändert');
      save();
      closeSheet();
      toast('Zeichen übernommen – Karte neu drucken nicht vergessen.');
    }
    return;
  }
  if (d.labelCopy){
    const c = copy(d.labelCopy), t = title(c.titleId);
    openSheet({ title:'QR-Etikett', body: () =>
      '<div class="card pad" style="display:flex;gap:16px;align-items:center">'+
        '<div class="qr-frame" style="width:150px;flex:none">'+qrSVG(c.token)+'</div>'+
        '<div><div style="font-weight:700;font-size:17px">'+esc(t.title)+'</div>'+
        '<div class="r-sub">Exemplar '+esc(c.inv)+'</div>'+
        '<div class="token" style="margin-top:10px">'+esc(c.token)+'</div></div></div>'+
      '<p class="hint">Auf dem Etikett stehen Inventarnummer und Titel nur zur Orientierung. Erkannt wird ausschließlich der Code.</p>',
      foot: () => '<button class="btn" data-act="close-sheet">Schließen</button>'+
        '<button class="btn btn-primary" style="flex:1" data-print-label="'+c.id+'">'+icon('printer')+'Etikett drucken</button>' });
    return;
  }
  if (d.addCopy){
    const c = addCopyTo(d.addCopy);
    render();
    toast('Exemplar '+c.inv+' angelegt – Etikett drucken nicht vergessen.');
    return;
  }
  if (d.draftCat){
    const cats = flow.draft.cats;
    const i = cats.indexOf(d.draftCat);
    if (i >= 0) cats.splice(i,1); else cats.push(d.draftCat);
    rerenderSheet();
    return;
  }
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-print-label]');
  if (!el) return;
  printLabels([copy(el.dataset.printLabel)]);
});

document.addEventListener('input', ev => {
  const el = ev.target, d = el.dataset;
  if (el.id === 'libSearch'){ lib.q = el.value; render(); return; }
  if (el.id === 'childSearch'){ flow.q = el.value; rerenderSheet(); return; }
  if (el.id === 'buchSuche'){ flow.qBuch = el.value; rerenderSheet(); return; }
  if (el.hasAttribute('data-roll-csv')){ roll.csv = el.value; return; }
  if (d.draft && flow && flow.draft){ flow.draft[d.draft] = el.value; return; }
  if (d.druckOff){ const e = druckEinstellungen(); e[d.druckOff] = parseFloat(el.value) || 0; save(); return; }
  if (el.hasAttribute && el.hasAttribute('data-druck-messwert')){
    const fehler = massstabNachMessung(el.value);
    if (fehler){ toast(fehler); return; }
    const neu = Math.round(druckSkala()*1000)/10;
    render();
    toast('Maßstab jetzt '+neu+' % – Prüfbogen noch einmal drucken und nachmessen.');
    return;
  }
  if (d.eigen){
    const s2 = druckEinstellungen();
    if (!s2.eigenes) s2.eigenes = { breite:70, hoehe:37, spalten:3, zeilen:8, luecke:0, lueckeY:0, randX:0, randY:0 };
    s2.eigenes[d.eigen] = Math.max(0, parseFloat(el.value) || 0);
    save();
    return;
  }
  if (d.bestand){ bestand[d.bestand] = el.value; return; }
  if (el.hasAttribute && el.hasAttribute('data-import-gruppe')){ kinderImport.neueGruppe = el.value; return; }
  if (d.set){
    const v = el.value;
    if (d.set === 'name') S.org.name = v || 'Einrichtung';
    else if (d.set === 'maxBooksGruppe') S.org.maxBooksGruppe = Math.max(0, parseInt(v, 10) || 0);
    else S.org[d.set] = Math.max(1, +v || 1);
    $('#orgName').textContent = S.org.name;
    save();
    return;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, d = el.dataset;
  if (el.hasAttribute && el.hasAttribute('data-kinder-datei')){
    const datei = el.files && el.files[0];
    if (!datei) return;
    kinderImport.fehler = null;
    Tabelle.ausDatei(datei).then(zeilen => {
      if (!zeilen.length) throw new Error('Die Datei enthält keine Zeilen.');
      kinderImport.zeilen = zeilen;
      kinderImport.datei = datei.name;
      importSpaltenRaten();
      render();
    }).catch(e => {
      kinderImport.zeilen = null;
      kinderImport.fehler = e.message || 'Die Datei ließ sich nicht lesen.';
      render();
    });
    return;
  }
  if (d.importSpalte){
    kinderImport[d.importSpalte] = parseInt(el.value, 10);
    render();
    return;
  }
  if (el.id === 'libAge'){ lib.age = el.value; render(); return; }
  if (d.druckFormat){
    const e = druckEinstellungen();
    if (d.druckFormat === 'karte') e.karte = el.value; else e.etikett = el.value;
    save(); render();
    return;
  }
  if (d.moveChild){
    const k = child(d.moveChild);
    if (k && k.groupId !== el.value){
      k.groupId = el.value;
      logAction(k.name+' in Gruppe "'+groupName(el.value)+'" verschoben');
      save(); render();
      toast('Gruppe geändert – Karte und Ausleihen bleiben unverändert.');
    }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter'){
    const el = ev.target;
    if (el && el.id === 'isbnManuell'){ ev.preventDefault(); ACTIONS['isbn-suchen'](); return; }
    if (el && el.id === 'dlgInput' && dialog){ ev.preventDefault(); ACTIONS['dlg-ok'](); return; }
  }
  if (ev.key !== 'Escape') return;
  if (dialog) closeDialog();
  else if (sheet) closeSheet();
});

/* ---------------------------------------------------------------- Start */
S = load();
render();
fassungPruefen(true);
</script>
