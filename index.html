<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KitaBib">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF9F5">
<meta name="color-scheme" content="light">
<title>KitaBib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* KitaBib · helle Pastellgestaltung, bewusst ein einziges Farbschema:
   Die Anwendung steht am Tresen im Gruppenraum und soll dort immer gleich
   freundlich aussehen – unabhängig davon, wie das Tablet eingestellt ist. */
:root{
  --paper:#FBF9F5; --sunk:#F3F0E9; --card:#FFFFFF; --card-2:#FDFCF9;
  --ink:#333F38; --ink-2:#68746C; --ink-3:#8A968E;
  --line:#EDE8DE; --line-strong:#DCD5C8;

  --green:#9ED4B4; --green-hover:#8CC9A6; --green-on:#22503A;
  --green-soft:#E8F3EC; --green-line:#C6E2D2; --green-deep:#457C61;

  --blue-soft:#E7EFF6; --blue-line:#CBDEEC; --blue-ink:#3B5F7B;
  --peach-soft:#FBEBDB; --peach-line:#F1D5B7; --peach-ink:#8A5A2C;
  --rose-soft:#FBE5E5; --rose-line:#F2C8C9; --rose-ink:#9C444C;
  --lilac-soft:#F0E9F7; --lilac-line:#DED0EC; --lilac-ink:#6B5090;

  --shadow:0 1px 2px rgba(83,101,89,.05), 0 10px 24px -16px rgba(70,90,76,.30);
  --shadow-lift:0 2px 6px rgba(83,101,89,.07), 0 22px 44px -22px rgba(70,90,76,.42);
  --r-s:14px; --r-m:20px; --r-l:28px;
  --ui:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Quicksand", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0; text-align:left}
:focus-visible{outline:3px solid var(--green-deep); outline-offset:3px; border-radius:6px}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.25; font-family:var(--display); font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- App-Rahmen ---------- */
.app{display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; max-height:100dvh}
.topbar{
  display:flex; align-items:center; gap:14px; padding:13px 22px;
  background:var(--card); border-bottom:1px solid var(--line);
}
.wordmark{
  font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.005em;
  display:flex; align-items:center; gap:10px; color:var(--green-on);
}
.wordmark .dot{width:13px; height:13px; border-radius:50%; background:var(--green); display:inline-block}
.orgname{color:var(--ink-2); font-size:14.5px; border-left:1px solid var(--line); padding-left:14px}
.topbar .spacer{flex:1}
.today{color:var(--ink-2); font-size:13.5px}

main{overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth}
.wrap{max-width:1080px; margin:0 auto; padding:26px 22px 40px}

.nav{
  display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
  background:var(--card); border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.nav button{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 4px 8px; border-radius:var(--r-s); color:var(--ink-2);
  font-size:12.5px; font-weight:700; text-align:center;
}
.nav button svg{width:24px; height:24px}
.nav button[aria-current="page"]{color:var(--green-on); background:var(--green-soft)}
.nav button:hover{background:var(--green-soft); color:var(--green-on)}
.nav button[aria-current="page"]:hover{background:var(--green-line)}

/* ---------- Typografie ---------- */
.screen-title{font-size:28px; font-weight:700; letter-spacing:-.01em}
.screen-sub{color:var(--ink-2); font-size:15.5px; margin-top:4px}
.eyebrow{font-family:var(--display); font-size:14px; font-weight:700; color:var(--ink-2); letter-spacing:.01em}
.section{display:flex; flex-direction:column; gap:12px}
.stack{display:flex; flex-direction:column; gap:20px}
.head-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}

/* ---------- Flächen ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* ---------- Knöpfe ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 22px; border-radius:999px; font-weight:700; font-size:16px;
  border:1px solid var(--line-strong); background:var(--card); color:var(--ink);
  min-height:52px; transition:transform .06s ease, background .14s ease;
}
.btn:hover{background:var(--sunk); color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px; height:20px; flex:none}
.btn-primary{background:var(--green); border-color:var(--green); color:var(--green-on)}
.btn-primary:hover{background:var(--green-hover)}
.btn-danger{color:var(--rose-ink); border-color:var(--rose-line); background:var(--rose-soft)}
.btn-danger:hover{background:var(--rose-line)}
.btn-ghost{border-color:transparent; background:transparent; color:var(--green-deep); padding-left:10px; padding-right:10px}
.btn-ghost:hover{background:var(--green-soft)}
.btn-sm{min-height:42px; padding:8px 16px; font-size:14.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}

/* Die beiden Hauptaktionen tragen den Bildschirm */
.hero-actions{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.hero-btn{
  display:flex; flex-direction:column; justify-content:space-between; gap:22px;
  min-height:178px; padding:24px; border-radius:var(--r-l);
  border:1px solid var(--green); background:var(--green); color:var(--green-on);
  box-shadow:var(--shadow); transition:transform .1s ease, box-shadow .16s ease;
}
.hero-btn:hover{box-shadow:var(--shadow-lift)}
.hero-btn:active{transform:translateY(2px)}
.hero-btn .hb-icon{width:40px; height:40px}
.hero-btn .hb-label{display:block; font-family:var(--display); font-size:27px; font-weight:700; letter-spacing:-.01em}
.hero-btn .hb-hint{display:block; font-size:14.5px; margin-top:3px; color:var(--green-on); opacity:.88}
.hero-btn.alt{background:var(--card); color:var(--ink); border-color:var(--line-strong)}
.hero-btn.alt .hb-icon{color:var(--green-deep)}
.hero-btn.alt .hb-hint{color:var(--ink-2); opacity:1}
.sub-actions{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.sub-btn{
  display:flex; align-items:center; gap:14px; padding:17px 18px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m);
  font-weight:700; box-shadow:var(--shadow);
}
.sub-btn:hover{border-color:var(--green-line); background:var(--card-2)}
.sub-btn svg{width:24px; height:24px; color:var(--green-deep); flex:none}
.sub-btn .sb-hint{display:block; font-weight:400; font-size:14px; color:var(--ink-2)}

/* ---------- Kennzahlen ---------- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.stat{background:var(--green-soft); border:1px solid var(--green-line); border-radius:var(--r-m); padding:16px 18px}
.stat .v{font-family:var(--display); font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; color:var(--green-on)}
.stat .k{color:var(--ink-2); font-size:14px; margin-top:3px}
.stat.warn{background:var(--rose-soft); border-color:var(--rose-line)}
.stat.warn .v{color:var(--rose-ink)}

/* ---------- Hinweise ---------- */
.notice{
  display:flex; align-items:flex-start; gap:14px; padding:16px 18px;
  border-radius:var(--r-m); border:1px solid var(--line); background:var(--card);
}
.notice svg{width:22px; height:22px; flex:none; margin-top:2px}
.notice .n-title{display:block; font-weight:700}
.notice .n-body{display:block; color:var(--ink-2); font-size:14.5px}
.notice .n-action{margin-left:auto; align-self:center}
.notice.overdue{background:var(--rose-soft); border-color:var(--rose-line)}
.notice.overdue svg{color:var(--rose-ink)}
.notice.overdue .n-body{color:var(--rose-ink)}
.notice.todo{background:var(--peach-soft); border-color:var(--peach-line)}
.notice.todo svg{color:var(--peach-ink)}
.notice.todo .n-body{color:var(--peach-ink)}
.notice.calm{background:var(--green-soft); border-color:var(--green-line)}
.notice.calm svg{color:var(--green-deep)}

/* ---------- Status: immer Text und Symbol, nie nur Farbe ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 10px;
  border-radius:999px; font-size:13.5px; font-weight:700; white-space:nowrap;
  border:1px solid var(--line-strong); background:var(--card); color:var(--ink-2);
}
.chip svg{width:15px; height:15px}
.chip.available{background:var(--blue-soft); border-color:var(--blue-line); color:var(--blue-ink)}
.chip.loaned{background:var(--peach-soft); border-color:var(--peach-line); color:var(--peach-ink)}
.chip.overdue{background:var(--rose-soft); border-color:var(--rose-line); color:var(--rose-ink)}
.chip.damaged{background:var(--lilac-soft); border-color:var(--lilac-line); color:var(--lilac-ink)}
.chip.retired{background:var(--card); border-color:var(--line-strong); color:var(--ink-2)}
.chip.ok{background:var(--green-soft); border-color:var(--green-line); color:var(--green-on)}
</style>
<style>
/* ---------- Bibliothek: Coverraster statt Tabelle ---------- */
.filters{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.search{
  flex:1 1 260px; display:flex; align-items:center; gap:11px; padding:13px 18px;
  background:var(--card); border:1px solid var(--line-strong); border-radius:999px;
}
.search svg{width:20px; height:20px; color:var(--ink-3); flex:none}
.search input{flex:1; border:none; background:none; outline:none; min-width:0}
select.pill{
  padding:12px 18px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--card); font-weight:700; font-size:14.5px;
}
.toggle-row{display:flex; gap:9px; flex-wrap:wrap}
.toggle{
  padding:9px 16px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--card); font-size:14.5px; font-weight:700; color:var(--ink-2);
}
.toggle:hover{background:var(--green-soft); color:var(--green-on)}
.toggle[aria-pressed="true"]{background:var(--green-soft); border-color:var(--green-line); color:var(--green-on)}

.grid-books{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:18px}
.book-card{display:flex; flex-direction:column; gap:10px; border-radius:var(--r-m)}
.book-card:hover .cover{transform:translateY(-4px); box-shadow:var(--shadow-lift)}
.cover{
  position:relative; aspect-ratio:3/4; border-radius:var(--r-m); overflow:hidden;
  box-shadow:var(--shadow); transition:transform .14s ease, box-shadow .14s ease;
  display:flex; flex-direction:column; justify-content:flex-end; padding:13px;
}
.cover .c-band{position:absolute; inset:0; z-index:0}
.cover .c-foto{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
.cover .c-schleier{position:absolute; left:0; right:0; bottom:0; height:62%; z-index:1;
  background:linear-gradient(to top, rgba(20,26,22,.82), rgba(20,26,22,0))}
.cover.foto .c-title, .cover.foto .c-author{color:#fff}
.cover .c-title{
  position:relative; z-index:1; font-family:var(--display); font-weight:700;
  font-size:15.5px; line-height:1.25;
}
.cover .c-author{position:relative; z-index:1; font-size:12px; margin-top:4px; opacity:.82}
.cover .c-flag{
  position:absolute; top:10px; right:10px; z-index:2; font-size:12px; font-weight:700;
  padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.92); color:var(--ink);
}
.cover .c-flag.none{background:var(--rose-soft); color:var(--rose-ink)}
.book-card .b-title{font-weight:700; font-size:15px; line-height:1.35}
.book-card .b-meta{color:var(--ink-2); font-size:13.5px}

/* ---------- Listen ---------- */
.list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); overflow:hidden; box-shadow:var(--shadow)}
.row{
  display:flex; align-items:center; gap:15px; padding:15px 18px;
  border-bottom:1px solid var(--line); width:100%; text-align:left; background:var(--card);
}
.row:last-child{border-bottom:none}
button.row:hover{background:var(--green-soft)}
.row .r-main{flex:1; min-width:0}
.r-title{display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.r-sub{display:block; color:var(--ink-2); font-size:14px}
.row .r-side{display:flex; align-items:center; gap:10px; flex:none}
.r-side > svg{width:20px; height:20px; flex:none; color:var(--ink-3)}
.avatar{
  width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:19px;
  background:var(--green-soft); color:var(--green-on);
}
.avatar svg{width:22px; height:22px; color:var(--green-deep)}
.copy-row{display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line)}
.copy-row:last-child{border-bottom:none}
.copy-row .inv{font-weight:700; font-variant-numeric:tabular-nums}
.stripe{width:5px; align-self:stretch; border-radius:3px; background:var(--blue-line); flex:none; min-height:34px}
.stripe.loaned{background:var(--peach-line)}
.stripe.overdue{background:var(--rose-line)}
.stripe.damaged{background:var(--lilac-line)}
.stripe.available{background:var(--blue-line)}
.stripe.retired{background:var(--line-strong)}

.empty{
  display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
  padding:48px 24px; color:var(--ink-2);
}
.empty svg{width:38px; height:38px; color:var(--green-line)}
.empty .e-title{font-family:var(--display); font-size:21px; font-weight:700; color:var(--ink)}

/* ---------- Formulare ---------- */
.field{display:flex; flex-direction:column; gap:7px}
.field label{font-size:14.5px; font-weight:700; color:var(--ink-2)}
.field input, .field select, .field textarea{
  padding:13px 16px; border-radius:var(--r-s); border:1px solid var(--line-strong);
  background:var(--card); outline:none; width:100%;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--green-deep)}
.field textarea{min-height:150px; resize:vertical; font-size:15px; line-height:1.6}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:15px}
.hint{color:var(--ink-2); font-size:14px}

/* ---------- Scan-Sheet ---------- */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(64,80,70,.34); z-index:50;
  display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px);
}
.sheet{
  width:min(720px,100%); max-height:92dvh; display:flex; flex-direction:column;
  background:var(--paper); border-radius:var(--r-l) var(--r-l) 0 0;
  border:1px solid var(--line); border-bottom:none; box-shadow:var(--shadow-lift);
  animation:rise .24s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} }
.sheet-head{
  display:flex; align-items:center; gap:12px; padding:17px 20px;
  border-bottom:1px solid var(--line); background:var(--card);
  border-radius:var(--r-l) var(--r-l) 0 0;
}
.sheet-head .sh-title{font-family:var(--display); font-weight:700; font-size:20px; flex:1}
.sheet-body{overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:18px}
/* Ohne dies quetscht die Flexspalte den Sucher zu einem Streifen zusammen,
   sobald der Sheet-Inhalt hoeher wird als das Fenster. */
.sheet-body > *{flex-shrink:0}
.sheet-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); display:flex; gap:12px}
.icon-btn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-strong); background:var(--card); color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:20px; height:20px}

/* Helle Scanfläche statt schwarzem Kamerakasten */
.viewfinder{
  position:relative; border-radius:var(--r-m); background:var(--green-soft); overflow:hidden;
  aspect-ratio:2/1; display:grid; place-items:center; border:1px solid var(--green-line);
}
.viewfinder .vf-frame{
  width:40%; aspect-ratio:1; border-radius:var(--r-m); position:relative;
  background:rgba(255,255,255,.55);
}
.vf-corner{position:absolute; width:28px; height:28px; border:3px solid var(--green-deep)}
.vf-corner.tl{top:-2px; left:-2px; border-right:none; border-bottom:none; border-radius:var(--r-m) 0 0 0}
.vf-corner.tr{top:-2px; right:-2px; border-left:none; border-bottom:none; border-radius:0 var(--r-m) 0 0}
.vf-corner.bl{bottom:-2px; left:-2px; border-right:none; border-top:none; border-radius:0 0 0 var(--r-m)}
.vf-corner.br{bottom:-2px; right:-2px; border-left:none; border-top:none; border-radius:0 0 var(--r-m) 0}
.vf-line{position:absolute; left:8%; right:8%; height:3px; border-radius:3px; background:var(--green-deep); opacity:.5; animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{top:16%} 50%{top:84%}}
@media (prefers-reduced-motion: reduce){ .vf-line{animation:none; top:50%} }
/* Sobald das Kamerabild laeuft, tritt die Pastellflaeche hinter das Bild zurueck */
.vf-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#1C241E}
.viewfinder.live{background:#1C241E; border-color:var(--green-deep)}
.viewfinder .vf-frame{z-index:1}
.viewfinder.live .vf-frame{background:transparent; box-shadow:0 0 0 999px rgba(18,26,20,.45)}
.viewfinder.live .vf-note{background:rgba(18,26,20,.72); color:#EAF4EE}
.viewfinder .vf-note{
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:2;
  font-size:13.5px; font-weight:700; color:var(--green-on);
  background:rgba(255,255,255,.85); padding:6px 14px; border-radius:999px;
}
.demo-strip{display:flex; flex-direction:column; gap:10px}
.demo-strip .ds-label{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.demo-tag{
  font-size:12px; font-weight:700; color:var(--lilac-ink); background:var(--lilac-soft);
  border:1px solid var(--lilac-line); padding:4px 11px; border-radius:999px;
}
.scan-chips{display:flex; gap:10px; flex-wrap:wrap}
.scan-chip{
  display:flex; align-items:center; gap:10px; padding:11px 16px; border-radius:var(--r-m);
  border:1px solid var(--line-strong); background:var(--card); font-size:15px; font-weight:700;
}
.scan-chip svg{width:20px; height:20px; flex:none; color:var(--green-deep)}
.scan-chip:hover{border-color:var(--green); background:var(--green-soft)}
.scan-chip .sc-sub{display:block; font-weight:400; color:var(--ink-2); font-size:13.5px}

.flash{
  display:flex; align-items:center; gap:11px; padding:14px 16px; border-radius:var(--r-m);
  font-weight:700; font-size:15px; border:1px solid var(--line-strong); background:var(--card-2);
}
.flash svg{width:20px; height:20px; flex:none}
.flash.ok{background:var(--green-soft); border-color:var(--green-line); color:var(--green-on)}
.flash.warn{background:var(--peach-soft); border-color:var(--peach-line); color:var(--peach-ink)}
.flash.err{background:var(--rose-soft); border-color:var(--rose-line); color:var(--rose-ink)}

/* ---------- Erfolgsmoment ---------- */
.success{display:flex; flex-direction:column; align-items:center; gap:15px; text-align:center; padding:28px 20px}
.success .s-mark{
  width:84px; height:84px; border-radius:50%; display:grid; place-items:center;
  background:var(--green); color:var(--green-on);
}
.success .s-mark svg{width:42px; height:42px; stroke-width:2.4}
.success .s-title{font-family:var(--display); font-size:29px; font-weight:700; letter-spacing:-.01em}
.success .s-body{color:var(--ink-2)}

/* ---------- QR ---------- */
.qr{display:block; width:100%; height:auto; image-rendering:pixelated}
.qr-frame{background:#fff; padding:12px; border-radius:var(--r-m); border:1px solid var(--line-strong)}
.ausweis-vorschau{
  background:var(--card); border:1px solid var(--line-strong); border-radius:var(--r-m);
  padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.zeichen-gitter{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px}
.zeichen-knopf{
  aspect-ratio:1; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--card);
  font-size:30px; display:grid; place-items:center; line-height:1;
}
.zeichen-knopf:hover{border-color:var(--green); background:var(--green-soft)}
.zeichen-knopf.gewaehlt{border-color:var(--green); background:var(--green-soft); box-shadow:inset 0 0 0 2px var(--green)}
.zeichen-knopf.belegt{opacity:.35}
.ausweis-vorschau .av-oben{display:flex; align-items:flex-start; gap:10px}
.ausweis-vorschau .av-feld{
  width:52px; height:52px; flex:none; border:1px dashed var(--line-strong); border-radius:8px;
  display:grid; place-items:center; color:var(--ink-3); font-size:11px;
}
.ausweis-vorschau .av-zeichen{
  width:52px; height:52px; flex:none; display:grid; place-items:center; font-size:32px; line-height:1;
}
.ausweis-vorschau .av-kopf{font-size:11.5px; color:var(--ink-2); line-height:1.3}
.ausweis-vorschau .av-name{font-family:var(--display); font-weight:700; font-size:22px; line-height:1.05; margin-top:6px}
.ausweis-vorschau .av-gruppe{font-size:13px; color:var(--ink-2); margin-top:2px}
.ausweis-vorschau .av-qr{margin-top:12px; background:#fff; border-radius:6px}
.ausweis-vorschau .av-qr svg{width:100%; height:auto; display:block}
.kidcard{
  display:flex; gap:18px; align-items:center; padding:20px;
  border:1px solid var(--green-line); border-radius:var(--r-m); background:var(--card);
  box-shadow:var(--shadow);
}
.kidcard .kc-qr{width:136px; flex:none}
.kidcard .kc-name{font-family:var(--display); font-size:27px; font-weight:700; line-height:1.15}
.kidcard .kc-group{color:var(--ink-2); font-size:15.5px; margin-top:3px}
.kidcard .kc-org{margin-top:14px; font-size:13px; color:var(--green-deep); font-weight:700}
.token{font-size:13px; color:var(--ink-2); word-break:break-all; font-variant-numeric:tabular-nums}


/* ---------- Kurzanleitung ---------- */
.anleitung{color:var(--ink)}
.anl-kopf{display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
  border-bottom:2px solid var(--green); padding-bottom:10px; margin-bottom:16px}
.anl-marke{font-family:var(--display); font-weight:700; font-size:26px; color:var(--green-on); line-height:1}
.anl-unter{color:var(--ink-2); font-size:14px; margin-top:4px}
.anl-regel{text-align:right; font-size:13px; font-weight:700; color:var(--green-on);
  background:var(--green-soft); border:1px solid var(--green-line); border-radius:var(--r-s); padding:8px 12px; line-height:1.35}
.anl-spalten{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.anl-block{background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px}
.anl-titel{display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:16px; margin-bottom:8px}
.anl-nr{width:24px; height:24px; border-radius:50%; background:var(--green); color:var(--green-on);
  display:grid; place-items:center; font-size:13px; font-weight:700; flex:none}
.anl-liste{margin:0; padding-left:20px; font-size:14px; line-height:1.5}
.anl-liste li{margin-bottom:5px}
.anl-fuss{margin-top:9px; font-size:13px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:8px}
.anl-breit{margin-top:16px}
.anl-tabelle{width:100%; font-size:13.5px; border-collapse:collapse}
.anl-tabelle td{padding:7px 10px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; white-space:normal}
.anl-tabelle tr:last-child td{border-bottom:none}
.anl-fall{font-weight:700; width:34%; color:var(--green-on)}
.anl-fuss-zeile{margin-top:16px; padding:12px 16px; border-radius:var(--r-m);
  background:var(--peach-soft); border:1px solid var(--peach-line); color:var(--peach-ink); font-size:13.5px}
@media (max-width:760px){ .anl-spalten{grid-template-columns:1fr} .anl-fall{width:40%} }

/* ---------- Vorschautabelle ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:13px 16px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-family:var(--display); font-size:14px; color:var(--ink-2); font-weight:700}
tr:last-child td{border-bottom:none}
.steps{display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--ink-2); font-size:14px}
.steps .step{display:flex; align-items:center; gap:8px; font-weight:700}
.steps .step .n{width:27px; height:27px; border-radius:50%; display:grid; place-items:center; background:var(--card); border:1px solid var(--line-strong); font-size:13px; color:var(--ink-2)}
.steps .step.on{color:var(--green-on)}
.steps .step.on .n{background:var(--green); color:var(--green-on)}
.steps .sep{opacity:.45}
.steps .sep svg{width:16px; height:16px}

/* ---------- Schmale Geräte ---------- */
@media (max-width:640px){
  body{font-size:16px}
  .hero-actions{grid-template-columns:1fr}
  .hero-btn{min-height:138px; gap:16px}
  .sub-actions{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .wrap{padding:20px 16px 32px}
  .orgname{display:none}
  .kidcard{flex-direction:column; align-items:flex-start}
}

/* ---------- Druck: Kinderkarten und Etiketten ---------- */
.printsheet{display:none}
@media print{
  .topbar,.nav,.no-print{display:none !important}
  main{overflow:visible}
  body{background:#fff; color:#000}
  .printsheet{display:block}
  /* Beim Druck eines Bogens verschwindet alles andere – auch offene Sheets,
     Dialoge und Hinweisblasen. Sonst verrutscht das Raster auf dem Papier. */
  body.printing-sheet > *:not(#printHost){display:none !important}
  /* Zweiter, zustandsfreier Weg: Sobald im Druckbogen etwas steht, tritt
     alles andere zurueck – unabhaengig davon, ob die Klasse noch gesetzt ist. */
  body:has(#printHost > *) > *:not(#printHost){display:none !important}
  #toast{display:none !important}
  @page{size:A4; margin:0}
  /* Ohne feste Breite setzt Safari die Seite in Bildschirmbreite (~980 px)
     und schrumpft sie aufs Papier – dann stimmt kein Millimetermass mehr.
     Mit dieser Regel ist die Layoutbreite genau eine A4-Seite. */
  html, body{width:210mm !important; min-width:0 !important; max-width:210mm !important;
             margin:0 !important; padding:0 !important}
  .druckseite{width:210mm; height:297mm; box-sizing:border-box; break-after:page; overflow:hidden}
  .druckseite:last-child{break-after:auto}
  .druckraster{display:grid}
  .druckzelle{display:flex; align-items:center; gap:3mm; padding:3mm; overflow:hidden; break-inside:avoid; background:#fff}
  .druckzelle.mit-rahmen{outline:0.2mm dashed #b9b9b9; outline-offset:-0.1mm}
  .druckzelle.pruef{justify-content:center; color:#777; font-size:11pt}
  .druckskala{transform-origin:top left}
  .pruef-kopf{font-size:9pt; color:#000; margin-bottom:4mm; font-family:var(--ui)}
  .pruef-massstab{margin-top:2mm; font-size:8pt; color:#333; display:flex; align-items:center; gap:2mm}
  .pruef-linie{display:inline-block; width:100mm; height:0.6mm; background:#000}
  .druckzelle .dz-qr{flex:none}
  .druckzelle .dz-qr svg{width:100%; height:auto; display:block}
  .druckzelle .dz-text{flex:1; min-width:0}
  .druckzelle .dz-name{font-family:var(--display); font-weight:700; line-height:1.1; color:#000}
  .druckzelle .dz-inv{font-weight:700; font-size:9pt; color:#000}
  .druckzelle .dz-klein{font-size:8pt; color:#333; line-height:1.2; overflow:hidden}
  .druckzelle .dz-org{font-size:7pt; color:#444; margin-top:2mm; letter-spacing:.04em}
  .druckzelle.ausweis{flex-direction:column; align-items:stretch; justify-content:flex-start; gap:0; padding:4.5mm}
  .druckzelle.ausweis .az-kopf{font-size:7pt; color:#3a3a3a; line-height:1.2}
  .druckzelle.ausweis .az-name{font-family:var(--display); font-weight:700; line-height:1.05; color:#000; margin-top:1.5mm}
  .druckzelle.ausweis .az-gruppe{font-size:8.5pt; color:#333; margin-top:0.6mm}
  .druckzelle.ausweis .az-oben{display:flex; align-items:flex-start; gap:3mm}
  .druckzelle.ausweis .az-text{flex:1; min-width:0}
  .druckzelle .az-feld{border:0.3pt dashed #999; border-radius:1.5mm; flex:none;
    display:grid; place-items:center; color:#999; font-size:7pt}
  .druckzelle .az-zeichen{flex:none; display:grid; place-items:center; line-height:1}
  .druckzelle .dz-feld{flex:none}
  .druckzelle.ausweis .az-qr{margin:2.5mm auto 0}
  .druckzelle.ausweis .az-qr svg{width:100%; height:auto; display:block}
  .anl-seite{padding:14mm 13mm; background:#fff; color:#000}
  .anl-seite .anl-kopf{border-bottom:1.2pt solid #2f5744; padding-bottom:3mm; margin-bottom:5mm}
  .anl-seite .anl-marke{font-size:20pt; color:#22503A}
  .anl-seite .anl-unter{font-size:9.5pt; color:#333}
  .anl-seite .anl-regel{font-size:9pt; background:#eef5f0; border:0.3pt solid #bcd8c7; color:#22503A}
  .anl-seite .anl-spalten{display:grid; grid-template-columns:repeat(3,1fr); gap:4mm}
  .anl-seite .anl-block{background:#fbfaf7; border:0.3pt solid #d8d4ca; border-radius:2mm; padding:3.5mm 4mm}
  .anl-seite .anl-titel{font-size:11pt; margin-bottom:2mm}
  .anl-seite .anl-nr{width:5mm; height:5mm; background:#9ED4B4; color:#22503A; font-size:8.5pt}
  .anl-seite .anl-liste{font-size:9pt; padding-left:4.5mm; line-height:1.42}
  .anl-seite .anl-fuss{font-size:8.5pt; color:#444; padding-top:2mm; border-top:0.3pt solid #d8d4ca}
  .anl-seite .anl-breit{margin-top:5mm}
  .anl-seite .anl-tabelle{font-size:9pt}
  .anl-seite .anl-tabelle td{padding:1.8mm 3mm 1.8mm 0; border-bottom:0.3pt solid #d8d4ca}
  .anl-seite .anl-fall{color:#22503A}
  .anl-seite .anl-fuss-zeile{margin-top:5mm; font-size:9pt; background:#fbeddc; border:0.3pt solid #e6ceac; color:#7a4f22; padding:3mm 4mm; border-radius:2mm}
  .cards-sheet{display:grid; grid-template-columns:1fr 1fr; gap:10mm; padding:0}
  .print-card{
    border:1px dashed #999; border-radius:6mm; padding:6mm; display:flex; gap:6mm;
    align-items:center; break-inside:avoid; background:#fff;
  }
  .print-card .pc-qr{width:34mm; flex:none}
  .labels-sheet{display:grid; grid-template-columns:repeat(4,1fr); gap:4mm}
  .print-label{border:1px dashed #999; padding:3mm; text-align:center; break-inside:avoid; background:#fff}
  .print-label .pl-qr{width:22mm; margin:0 auto}
  @page{margin:12mm}
}

        if (q < 0 || q >= (senkrecht ? w : h)) continue;
        summe += senkrecht ? grau[i * w + q] : grau[q * w + i];
        n++;
      }
      p[i] = summe / n;
    }
    return p;
  }
  function laeufeAusProfil(p) {
    var min = Infinity, max = -Infinity, i;
    for (i = 0; i < p.length; i++) { if (p[i] < min) min = p[i]; if (p[i] > max) max = p[i]; }
    if (max - min < 28) return null;                 // zu wenig Kontrast
    var schwelle = (min + max) / 2;
    return laeufe(function (k) { return p[k] < schwelle ? 1 : 0; }, p.length);
  }

  function decodeGrau(grau, w, h) {
    var dicke = Math.max(1, Math.round(Math.min(w, h) / 120));
    var schritt = Math.max(3, Math.round(h / 30)), i, runs, ergebnis;
    for (i = schritt; i < h; i += schritt) {
      runs = laeufeAusProfil(profil(grau, w, h, i, dicke, false));
      if (runs && runs.length >= 59) { ergebnis = ausLaeufen(runs); if (ergebnis) return ergebnis; }
    }
    var schrittX = Math.max(3, Math.round(w / 30));
    for (i = schrittX; i < w; i += schrittX) {
      runs = laeufeAusProfil(profil(grau, w, h, i, dicke, true));
      if (runs && runs.length >= 59) { ergebnis = ausLaeufen(runs); if (ergebnis) return ergebnis; }
    }
    return null;
  }

  root.EAN = { decodeGrau: decodeGrau };
})(window);
</script>

function newToken(kind){
  const alphabet = '23456789abcdefghjkmnpqrstuvwxyz'; // ohne l/o/0/1 – nicht verwechselbar
  const buf = new Uint8Array(10);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
  else for (let i=0;i<10;i++) buf[i] = Math.floor(Math.random()*256);
  let s = '';
  for (let i=0;i<10;i++) s += alphabet[buf[i] % alphabet.length];
  return 'KB-'+kind+'-'+s;

<script>
/* ======================================================= Zustand & Ablage */
const STORAGE_KEY = 'kitabib.prototyp.v1';
let S = null;

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* Privatmodus o. Ae. */ }
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.titles && parsed.children) return parsed;
    }
  } catch (e) { /* beschaedigt oder gesperrt: Demo-Daten */ }
  return buildSeed();
}
function resetData(){ S = buildSeed(); save(); }
function logAction(text){
  S.log.unshift({ ts: todayISO()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes()), text });
  S.log = S.log.slice(0, 50);
}

/* ------------------------------------------------------------ Abfragen */
/* Rollen nach Pflichtenheft 7.2. Im Prototyp umgeschaltet statt angemeldet –
   im MVP entscheidet die Anmeldung darüber. */
function istAdmin(){ return (S.rolle || 'admin') === 'admin'; }

/* Neben den Kinderkonten kann jede Gruppe ein eigenes Konto haben – für
   Themenkisten, die wochenlang im Gruppenraum stehen. Dahinter steckt keine
   Person, sondern eine Organisationseinheit; deshalb gelten andere Regeln
   und es gibt nichts zu anonymisieren. */
function istGruppenkonto(k){ return !!k && k.typ === 'gruppe'; }
function echteKinder(){ return S.children.filter(k => !istGruppenkonto(k)); }
function gruppenkonten(){ return S.children.filter(istGruppenkonto); }
function gruppenkontoVon(gid){ return S.children.filter(k => istGruppenkonto(k) && k.groupId === gid)[0]; }
function grenzeFuer(k){
  if (!istGruppenkonto(k)) return S.org.maxBooks;
  const g = S.org.maxBooksGruppe;
  return (g === 0 || g === undefined || g === null) ? Infinity : g;   // 0 = unbegrenzt
}
function leihdauerFuer(k){
  return istGruppenkonto(k) ? (S.org.loanDaysGruppe || 28) : S.org.loanDays;
}
function grenzeText(k){
  const g = grenzeFuer(k);
  return g === Infinity ? 'unbegrenzt' : g + ' Bücher';
}
function gruppenkontoAnlegen(g){
  const k = { id: uid('gk'), name: g.name, groupId: g.id, active: true, typ: 'gruppe',
              token: newToken('G'), importKey: null, familyId: null };
  S.children.push(k);
  logAction('Gruppenkonto für „'+g.name+'" angelegt');
  save();
  return k;
}

/* Was auf dem Bibliotheksausweis erscheint, entscheidet jede Einrichtung
   selbst – die Bedarfe gehen weit auseinander, und jede Angabe mehr ist eine
   Angabe, die auf einem Kärtchen die Kita verlassen kann. */
var ZEICHEN = ['🍎','⭐','🐻','🌸','🚗','🐟','🦋','🌳','☀️','🐸','🍀','🎈','🐘','🚂','🌙','🐌','🦉','🍄','⛵','🐝'];
function karteEinstellungen(){
  if (!S.org.karte){
    S.org.karte = {
      vorname: true,
      gruppe: S.org.showGroupOnCard !== false,   // alte Einstellung übernehmen
      kita: true,
      feld: 'keins'                              // keins | aufkleben | symbol
    };
  }
  return S.org.karte;
}
/* Zeichen vergeben: möglichst im ganzen Haus eindeutig – die Karten liegen
   meist in einer Kiste, nicht nach Gruppen getrennt. Reicht der Vorrat nicht,
   wird wenigstens innerhalb der Gruppe kein Zeichen doppelt vergeben. */
function zeichenFuer(k){
  if (k.zeichen) return k.zeichen;
  const imHaus = echteKinder().filter(x => x.id !== k.id && x.zeichen).map(x => x.zeichen);
  const hausweitFrei = ZEICHEN.filter(z => imHaus.indexOf(z) < 0);
  if (hausweitFrei.length){ k.zeichen = hausweitFrei[0]; return k.zeichen; }
  const inGruppe = S.children.filter(x => x.groupId === k.groupId && x.id !== k.id && x.zeichen).map(x => x.zeichen);
  const gruppeFrei = ZEICHEN.filter(z => inGruppe.indexOf(z) < 0);
  k.zeichen = gruppeFrei.length ? gruppeFrei[0] : ZEICHEN[S.children.indexOf(k) % ZEICHEN.length];
  return k.zeichen;
}
const byId = (arr, id) => arr.find(x => x.id === id);
const title = id => byId(S.titles, id);
const copy = id => byId(S.copies, id);
const child = id => byId(S.children, id);
const group = id => byId(S.groups, id);
const activeLoans = () => S.loans.filter(l => !l.returnedAt);
const loanOfCopy = cid => S.loans.find(l => l.copyId === cid && !l.returnedAt);
const loansOfChild = kid => activeLoans().filter(l => l.childId === kid);
const isOverdue = l => !l.returnedAt && daysDiff(l.due, todayISO()) > 0;
const overdueLoans = () => activeLoans().filter(isOverdue);
const copiesOfTitle = tid => S.copies.filter(c => c.titleId === tid);

const STATUS = {

  loaned:   { label:'Ausgeliehen', chip:'loaned', icon:'clock' },
  damaged:  { label:'Prüfung erforderlich', chip:'damaged', icon:'alert' },

};
function statusChip(status, overdue){
  if (overdue) return '<span class="chip overdue">'+icon('alert')+'Überfällig</span>';
  const s = STATUS[status] || STATUS.available;
  return '<span class="chip '+s.chip+'">'+icon(s.icon)+esc(s.label)+'</span>';
}

/* ---------------------------------------------------------------- QR-Bild */
function qrSVG(text, cls){
  const m = window.qrMatrix(text), n = m.length, q = 2, size = n + q*2;
  let rects = '';
  for (let r=0;r<n;r++){
    let c = 0;
    while (c < n){
      if (m[r][c]){
        let w = 1;
        while (c+w < n && m[r][c+w]) w++;      // waagerechte Laeufe zusammenfassen
        rects += '<rect x="'+(c+q)+'" y="'+(r+q)+'" width="'+w+'" height="1"/>';
        c += w;
      } else c++;
    }
  }
  return '<svg class="qr '+(cls||'')+'" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" '+
    'role="img" aria-label="QR-Code"><rect width="'+size+'" height="'+size+'" fill="#fff"/>'+
    '<g fill="#101510">'+rects+'</g></svg>';
}

/* -------------------------------------------------------------- Coverbild */
function coverArt(t, flag){
  if (t.cover){
    return '<div class="cover foto">'+
      '<img class="c-foto" src="'+t.cover+'" alt="Cover von '+esc(t.title)+'">'+
      '<span class="c-schleier"></span>'+ (flag||'')+
      '<div class="c-title">'+esc(t.title.length>44 ? t.title.slice(0,42)+'…' : t.title)+'</div>'+
      '<div class="c-author">'+esc(t.author)+'</div></div>';
  }
  const [flaeche, form, schrift] = COVER_PALETTE[t.coverIdx % COVER_PALETTE.length];
  const seed = t.title.length * 7 + t.year;
  const band = '<svg class="c-band" viewBox="0 0 90 120" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect width="90" height="120" fill="'+flaeche+'"/>'+
    '<circle cx="'+(22 + seed % 44)+'" cy="'+(30 + seed % 24)+'" r="'+(23 + seed % 13)+'" fill="'+form+'"/>'+
    '<path d="M0 '+(74 + seed % 14)+' Q 45 '+(56 + seed % 20)+' 90 '+(80 + seed % 11)+' V120 H0 Z" fill="'+form+'" opacity=".7"/>'+
    '</svg>';
  return '<div class="cover" style="color:'+schrift+'">'+band+
    (flag||'')+
    '<div class="c-title">'+esc(t.title.length>44 ? t.title.slice(0,42)+'…' : t.title)+'</div>'+
    '<div class="c-author">'+esc(t.author)+'</div></div>';
}

                 labels:'more', cards:'more', rollover:'more', bestand:'more', stats:'more', anleitung:'more', kinderimport:'more', kategorien:'more', log:'more', privacy:'more' };

<script>
/* ==================================================== Sheets und Scanner */
let sheet = null;   // { title, body(), foot(), wide }
let flow  = null;   // Zustand des laufenden Vorgangs
const scanLock = {};  // Scan-Schutz: Token -> Zeitpunkt der letzten Erfassung
const SCAN_LOCK_MS = 3000;

function openSheet(cfg){ sheet = cfg; renderSheet(); }
function closeSheet(){ druckModusBeenden(); if (window.Kamera) Kamera.stop(); sheet = null; flow = null; $('#sheetHost').innerHTML = ''; document.body.style.overflow=''; render(); }
function renderSheet(){
  if (!sheet){ $('#sheetHost').innerHTML=''; if (window.Kamera) Kamera.stop(); return; }
  document.body.style.overflow = 'hidden';
  $('#sheetHost').innerHTML =
    '<div class="sheet-backdrop" data-backdrop><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(sheet.title)+'">'+
      '<div class="sheet-head">'+
        '<span class="sh-title">'+esc(sheet.title)+'</span>'+
        '<button class="icon-btn" data-act="close-sheet" aria-label="Schließen">'+icon('x')+'</button>'+
      '</div>'+
      '<div class="sheet-body">'+sheet.body()+'</div>'+
      (sheet.foot ? '<div class="sheet-foot">'+sheet.foot()+'</div>' : '')+
    '</div></div>';
  if (window.Kamera) Kamera.anbinden();
}

/* Sucher mit echtem Kamerabild. `ziel` bestimmt, was ein erkannter Code ausloest. */
function viewfinder(note, ziel){
  return '<div class="viewfinder" data-scan="'+(ziel||'')+'"><div class="vf-frame">'+
    '<span class="vf-corner tl"></span><span class="vf-corner tr"></span>'+
    '<span class="vf-corner bl"></span><span class="vf-corner br"></span>'+
    '<span class="vf-line"></span></div>'+
    '<span class="vf-note" data-vf-note>'+esc(note||'QR-Code in den Rahmen halten')+'</span></div>';
}

/* ------------------------------------------------------------- Kamera */
var SCAN_ZIEL = {
  kind:      function (tok) { scanChildToken(tok); },
  buch:      function (tok) { scanCopyForLoan(tok); },
  rueckgabe: function (tok) { scanCopyForReturn(tok); },
  isbn:      function (code) { scanISBN(code); }
};
var Kamera = {
  video:null, canvas:null, ctx:null, stream:null, timer:null,
  zustand:'aus',           // aus | startet | laeuft | verweigert | keineKamera | unsicher | fehler
  ziel:null, detector:null, detectorGeprueft:false,

  verfuegbar: function () { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); },

  hinweis: function () {
    switch (this.zustand) {
      case 'startet':    return 'Kamera wird gestartet …';
      case 'laeuft':     return 'Code in den Rahmen halten';
      case 'verweigert': return (window.self !== window.top)
        ? 'Kamera in dieser eingebetteten Ansicht gesperrt – unten antippen oder die Datei über https öffnen'
        : 'Kamera nicht freigegeben – unten antippen oder den Zugriff erlauben';
      case 'keineKamera':return 'Keine Kamera gefunden – unten antippen';
      case 'unsicher':   return 'Kamera braucht eine sichere Verbindung (https)';
      case 'fehler':     return 'Kamera nicht verfügbar – unten antippen';
      default:           return 'Kamera wird vorbereitet …';
    }
  },
  notizSetzen: function () {
    var el = document.querySelector('[data-vf-note]');
    if (el) el.textContent = this.hinweis();
    var rahmen = document.querySelector('.viewfinder');
    if (rahmen) rahmen.classList.toggle('live', this.zustand === 'laeuft');
  },

  start: function () {
    if (this.zustand === 'startet' || this.zustand === 'laeuft') return;
    if (!window.isSecureContext && location.protocol !== 'http:') { this.zustand = 'unsicher'; this.notizSetzen(); return; }
    if (!this.verfuegbar()) { this.zustand = 'fehler'; this.notizSetzen(); return; }
    this.zustand = 'startet'; this.notizSetzen();
    var self = this;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (stream) {
        self.stream = stream;
        if (!self.video) {
          var v = document.createElement('video');
          v.setAttribute('playsinline', '');   // ohne dies nimmt iOS den Vollbildmodus
          v.setAttribute('muted', '');
          v.muted = true; v.autoplay = true; v.className = 'vf-video';
          self.video = v;
          self.canvas = document.createElement('canvas');
          self.ctx = self.canvas.getContext('2d', { willReadFrequently: true });
        }
        self.video.srcObject = stream;
        var abspielen = self.video.play();
        if (abspielen && abspielen.catch) abspielen.catch(function () {});
        self.zustand = 'laeuft';
        self.anbinden();
        self.schleifeStarten();
      })
      .catch(function (e) {
        self.zustand = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? 'verweigert'
                     : (e && e.name === 'NotFoundError') ? 'keineKamera' : 'fehler';
        self.notizSetzen();
      });
  },

  stop: function () {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.stream) { this.stream.getTracks().forEach(function (t) { t.stop(); }); this.stream = null; }
    if (this.video && this.video.parentNode) this.video.parentNode.removeChild(this.video);
    if (this.video) this.video.srcObject = null;
    this.zustand = 'aus'; this.ziel = null;
  },

  /* Nach jedem Neuzeichnen aufrufen: Videobild in den aktuellen Sucher schieben */
  anbinden: function () {
    var rahmen = document.querySelector('.viewfinder[data-scan]');
    if (!rahmen || !rahmen.dataset.scan) {
      if (this.video && this.video.parentNode) this.video.parentNode.removeChild(this.video);
      this.ziel = null;
      if (!rahmen) this.stop();
      return;
    }
    this.ziel = rahmen.dataset.scan;
    if (this.zustand === 'aus') { this.start(); return; }
    if (this.video && this.video.parentNode !== rahmen) rahmen.insertBefore(this.video, rahmen.firstChild);
    this.notizSetzen();
    this.schleifeStarten();
  },

  schleifeStarten: function () {
    if (this.timer) return;
    var self = this;
    this.timer = setInterval(function () { self.bildLesen(); }, 120);
  },

  bildLesen: function () {
    if (this.zustand !== 'laeuft' || !this.video || !this.ziel) return;
    var v = this.video;
    if (v.readyState < 2 || !v.videoWidth) return;
    var skala = Math.min(1, 480 / v.videoWidth);
    var w = Math.round(v.videoWidth * skala), h = Math.round(v.videoHeight * skala);
    if (this.canvas.width !== w) { this.canvas.width = w; this.canvas.height = h; }
    this.ctx.drawImage(v, 0, 0, w, h);
    var bild;
    try { bild = this.ctx.getImageData(0, 0, w, h).data; } catch (e) { return; }
    var grau = new Uint8Array(w * h);
    for (var i = 0, j = 0; j < grau.length; i += 4, j++)
      grau[j] = (bild[i] * 77 + bild[i + 1] * 150 + bild[i + 2] * 29) >> 8;
    var text = null;
    if (this.ziel === 'isbn') text = window.EAN.decodeGrau(grau, w, h);   // Strichcode statt QR
    else if (this.ziel !== 'foto') text = window.QRD.decodeGrau(grau, w, h);
    if (text) this.treffer(text);
  },

  /* Standbild fuer das Coverfoto */
  standbild: function (maxBreite) {
    if (this.zustand !== 'laeuft' || !this.video || !this.video.videoWidth) return null;
    var v = this.video, skala = Math.min(1, maxBreite / v.videoWidth);
    var c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * skala);
    c.height = Math.round(v.videoHeight * skala);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    try { return c.toDataURL('image/jpeg', 0.62); } catch (e) { return null; }
  },

  treffer: function (text) {
    var jetzt = Date.now();
    if (scanLock[text] && jetzt - scanLock[text] < SCAN_LOCK_MS) return;   // still übergehen
    var fn = SCAN_ZIEL[this.ziel];
    if (!fn) return;
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
    fn(text);
  }
};

function demoScanStrip(label, items){
  return '<div class="demo-strip">'+
    '<div class="ds-label"><span class="demo-tag">Ohne Kamera</span><span class="hint">'+esc(label)+'</span></div>'+
    '<div class="scan-chips">'+items+'</div></div>';
}
function flashMsg(kind, text){
  const ic = kind==='ok' ? 'check' : kind==='err' ? 'alert' : 'info';
  return '<div class="flash '+kind+'">'+icon(ic)+'<span>'+esc(text)+'</span></div>';
}
/* Gibt true zurueck, wenn der Code gerade eben schon verbucht wurde */
function scanBlocked(token){
  const now = Date.now();
  if (scanLock[token] && now - scanLock[token] < SCAN_LOCK_MS) return true;
  scanLock[token] = now;
  return false;
}

/* ------------------------------------------------------------- Ausleihe */
function startLoan(){
  flow = { type:'loan', step:'child', childId:null, copyIds:[], msg:null };
  openSheet({ title:'Ausleihen', body:loanBody, foot:loanFoot });
}
function loanBody(){
  if (flow.step === 'child'){
    const cands = S.children.filter(k => k.active).slice(0,4);
    return (flow.msg ? flashMsg(flow.msg.kind, flow.msg.text) : '')+
      viewfinder('Bibliothekskarte des Kindes scannen', 'kind')+
      demoScanStrip('Karte zum Scannen antippen:',
        cands.map(k => '<button class="scan-chip" data-scan-child="'+k.token+'">'+icon('card')+
          '<span>'+esc(k.name)+'<span class="sc-sub">'+esc(groupName(k.groupId))+'</span></span></button>').join(''))+
      '<button class="btn btn-block" data-act="manual-child">'+icon('search')+'Kind manuell suchen</button>';
  }
  if (flow.step === 'search'){
    const q = (flow.q||'').toLowerCase();
    const hits = S.children.filter(k => k.active && (!q || k.name.toLowerCase().includes(q)));
    return '<div class="search">'+icon('search')+'<input id="childSearch" placeholder="Vorname eingeben" value="'+esc(flow.q||'')+'" autocomplete="off"></div>'+
      '<div class="list">'+ (hits.length ? hits.map(k =>
        '<button class="row" data-pick-child="'+k.id+'"><span class="avatar">'+esc(k.name[0])+'</span>'+
        '<span class="r-main"><span class="r-title">'+esc(k.name)+'</span>'+
        '<span class="r-sub">'+esc(groupName(k.groupId))+' · '+plural(loansOfChild(k.id).length,'Buch','Bücher')+' ausgeliehen</span></span>'+
        '<span class="r-side">'+icon('next')+'</span></button>').join('')
        : '<div class="empty"><span class="e-title">Kein Kind gefunden</span></div>')+'</div>';
  }
  if (flow.step === 'books'){
    const k = child(flow.childId);
    const openCount = loansOfChild(k.id).length;
    const limitLeft = grenzeFuer(k) - openCount - flow.copyIds.length;
    const picked = flow.copyIds.map(cid => {
      const c = copy(cid), t = title(c.titleId);
      return '<div class="row"><span class="stripe available"></span>'+
        '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
        '<span class="r-sub">Exemplar '+esc(c.inv)+'</span></span>'+
        '<span class="r-side"><button class="btn btn-sm" data-unpick="'+cid+'">'+icon('minus')+'Entfernen</button></span></div>';
    }).join('');
    const cands = S.copies.filter(c => c.status === 'available' && !flow.copyIds.includes(c.id)).slice(0,4);
    return '<div class="card pad" style="display:flex;align-items:center;gap:13px">'+
        '<span class="avatar">'+esc(k.name[0])+'</span>'+
        '<span style="flex:1"><span style="font-weight:700;font-size:18px">'+esc(k.name)+'</span>'+
        '<span class="r-sub" style="display:block">'+esc(groupName(k.groupId))+' · '+
        (openCount ? plural(openCount,'Buch','Bücher')+' bereits ausgeliehen' : 'keine offenen Ausleihen')+'</span></span>'+
        '<button class="btn btn-sm" data-act="change-child">Kind wechseln</button></div>'+
      (flow.msg ? flashMsg(flow.msg.kind, flow.msg.text) : '')+
      (limitLeft <= 0 ? flashMsg('warn','Grenze erreicht: '+grenzeText(k)+' gleichzeitig.') : '')+
      (flow.copyIds.length ? '<div class="list">'+picked+'</div>' : '')+
      viewfinder('Buch scannen'+(flow.copyIds.length ? ' – oder Ausleihe abschließen' : ''), 'buch')+
      '<button class="btn btn-block" data-act="buch-suchen">'+icon('search')+'Buch ohne Etikett suchen</button>'+
      demoScanStrip('Buchetikett zum Scannen antippen:',
        cands.map(c => { const t = title(c.titleId);
          return '<button class="scan-chip" data-scan-copy="'+c.token+'">'+icon('book')+
            '<span>'+esc(t.title.length>26?t.title.slice(0,24)+'…':t.title)+'<span class="sc-sub">'+esc(c.inv)+'</span></span></button>';
        }).join(''));
  }
  if (flow.step === 'buchsuche'){
    const q = (flow.qBuch||'').toLowerCase();
    const treffer = S.copies
      .filter(c => c.status === 'available' && !flow.copyIds.includes(c.id))
      .filter(c => { const t = title(c.titleId); return !q || (t.title+' '+t.author+' '+c.inv).toLowerCase().includes(q); })
      .slice(0, 40);
    return '<div class="search">'+icon('search')+'<input id="buchSuche" placeholder="Titel, Autor/in oder Inventarnummer" value="'+esc(flow.qBuch||'')+'" autocomplete="off"></div>'+
      (treffer.length ? '<div class="list">'+treffer.map(c => { const t = title(c.titleId);
        return '<button class="row" data-pick-copy="'+c.id+'"><span class="stripe available"></span>'+
          '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
          '<span class="r-sub">'+esc(t.author)+' · '+esc(c.inv)+'</span></span>'+
          '<span class="r-side">'+icon('plus')+'</span></button>'; }).join('')+'</div>'
        : '<div class="card"><div class="empty">'+icon('search')+'<span class="e-title">Kein freies Exemplar gefunden</span>'+
          '<span>Vielleicht ist es gerade ausgeliehen oder liegt zur Prüfung.</span></div></div>');
  }
  if (flow.step === 'done'){
    const k = child(flow.childId);
    const due = addDays(todayISO(), leihdauerFuer(k));
    return '<div class="success"><span class="s-mark">'+icon('check')+'</span>'+
      '<span class="s-title">'+esc(plural(flow.copyIds.length,'Buch','Bücher'))+' für '+esc(k.name)+'</span>'+
      '<span class="s-body">Rückgabe bis <strong>'+fmtDate(due)+'</strong> · '+esc(groupName(k.groupId))+'</span></div>'+
      '<div class="list">'+flow.copyIds.map(cid => { const c = copy(cid), t = title(c.titleId);
        return '<div class="row"><span class="stripe loaned"></span><span class="r-main">'+
          '<span class="r-title">'+esc(t.title)+'</span><span class="r-sub">Exemplar '+esc(c.inv)+'</span></span>'+
          '<span class="r-side">'+statusChip('loaned')+'</span></div>'; }).join('')+'</div>';
  }
}
function loanFoot(){
  if (flow.step === 'books'){
    return '<button class="btn" data-act="close-sheet">Abbrechen</button>'+
      '<button class="btn btn-primary" style="flex:1" data-act="confirm-loan"'+(flow.copyIds.length?'':' disabled')+'>'+
      icon('check')+'Ausleihe bestätigen'+(flow.copyIds.length?' ('+flow.copyIds.length+')':'')+'</button>';
  }
  if (flow.step === 'done'){
    return '<button class="btn" data-act="loan-again">'+icon('plus')+'Nächstes Kind</button>'+
      '<button class="btn btn-primary" style="flex:1" data-act="close-sheet">Fertig</button>';
  }
  if (flow.step === 'search') return '<button class="btn btn-block" data-act="back-to-scan">'+icon('back')+'Zurück zum Scannen</button>';
  if (flow.step === 'buchsuche') return '<button class="btn btn-block" data-act="zurueck-zu-buechern">'+icon('back')+'Zurück zum Scannen</button>';
  return '<button class="btn btn-block" data-act="close-sheet">Abbrechen</button>';
}

<script>
/* ------------------------------------------------------------- Rückgabe */
function startReturn(){
  flow = { type:'return', quick:false, pending:null, done:[], msg:null };
  openSheet({ title:'Zurückgeben', body:returnBody, foot:returnFoot });
}
function returnBody(){
  const parts = [];
  if (flow.suche){
    const q = (flow.qBuch||'').toLowerCase();
    const treffer = activeLoans().filter(l => {
      const c = copy(l.copyId), t = title(c.titleId), k = child(l.childId);
      return !q || (t.title+' '+t.author+' '+c.inv+' '+(k?k.name:'')).toLowerCase().includes(q);
    }).slice(0, 40);
    return '<div class="search">'+icon('search')+'<input id="buchSuche" placeholder="Titel, Kind oder Inventarnummer" value="'+esc(flow.qBuch||'')+'" autocomplete="off"></div>'+
      (treffer.length ? '<div class="list">'+treffer.map(l => { const c = copy(l.copyId), t = title(c.titleId), k = child(l.childId), over = isOverdue(l);
        return '<button class="row" data-pick-return="'+c.id+'"><span class="stripe '+(over?'overdue':'loaned')+'"></span>'+
          '<span class="r-main"><span class="r-title">'+esc(t.title)+'</span>'+
          '<span class="r-sub">'+esc(k?k.name:'—')+' · '+esc(c.inv)+' · fällig '+fmtDate(l.due)+'</span></span>'+
          '<span class="r-side">'+(over?'<span class="chip overdue">'+icon('alert')+'überfällig</span>':'')+icon('next')+'</span></button>'; }).join('')+'</div>'
        : '<div class="card"><div class="empty">'+icon('search')+'<span class="e-title">Keine passende Ausleihe</span></div></div>');
  }
  parts.push('<div class="card pad" style="display:flex;align-items:center;gap:12px">'+
    '<span style="flex:1"><strong>Schnellmodus</strong>'+
    '<span class="r-sub" style="display:block">Scan gilt sofort als Rückgabe – für größere Stapel</span></span>'+
    '<button class="toggle" data-act="toggle-quick" aria-pressed="'+(flow.quick?'true':'false')+'">'+
    (flow.quick?'An':'Aus')+'</button></div>');
  if (flow.msg) parts.push(flashMsg(flow.msg.kind, flow.msg.text));

  if (flow.pending){
    const c = copy(flow.pending.copyId), t = title(c.titleId), l = flow.pending.loan, k = child(l.childId);
    const over = isOverdue(l);
    parts.push('<div class="card pad" style="display:flex;flex-direction:column;gap:12px">'+
      '<div style="display:flex;gap:14px;align-items:flex-start">'+
        '<div style="width:78px;flex:none">'+coverArt(t)+'</div>'+

          '<span><span style="font-size:17px">Sammeln und später drucken</span>'+
          '<span class="sb-hint">'+plural(warten,'Etikett wartet','Etiketten warten')+
          ' · ein Bogen fasst '+proBogen+'</span></span></button>'+
        '<p class="hint">Beim Sammeln erinnert der Startbildschirm daran, und der Bogen wird voll ausgenutzt.</p>'+
      '</div>';
  }
}
function field(label, key, val, type){
  const id = 'f_'+key;
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+
    '<input id="'+id+'" data-draft="'+key+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"></div>';
}
function addFoot(){
  if (flow.step === 'choose') return '<button class="btn btn-block" data-act="close-sheet">Abbrechen</button>';
  if (flow.step === 'scanning' || flow.step === 'foto')
    return '<button class="btn btn-block" data-act="add-back">'+icon('back')+'Zurück</button>';
  if (flow.step === 'suche') return '<button class="btn btn-block" data-act="add-back">Abbrechen</button>';
  if (flow.step === 'duplicate')
    return '<button class="btn" data-act="add-back">Abbrechen</button>'+
      '<button class="btn btn-primary" style="flex:1" data-act="add-copy-only">'+icon('plus')+'Weiteres Exemplar anlegen</button>';
  if (flow.step === 'done')
    return '<button class="btn" data-act="add-restart">'+icon('plus')+'Nächstes Buch</button>'+
      '<button class="btn btn-primary" style="flex:1" data-act="close-sheet">Fertig</button>';

    '<button class="btn btn-primary" style="flex:1" data-act="save-book">'+icon('check')+'Speichern und Etikett erzeugen</button>';
}

<script>

    act:'<button class="btn btn-sm" data-go="overdue">Ansehen</button>' });

    b:'Nach der Rückgabe als beschädigt gemeldet', act:'<button class="btn btn-sm" data-go="damaged">Ansehen</button>' });
  const fehltEtikett = ohneEtikett();
  if (fehltEtikett.length) notices.push({ cls:'todo', ic:'label',
    t: plural(fehltEtikett.length,'Exemplar','Exemplare')+' ohne Etikett',
    b: fehltEtikett.slice(0,3).map(c => title(c.titleId).title+' ('+c.inv+')').join(' · ')+
       (fehltEtikett.length>3 ? ' …' : ''),

  if (noCard.length) notices.push({ cls:'todo', ic:'card', t:plural(noCard.length,'Kind','Kinder')+' ohne Bibliothekskarte',
    b: noCard.map(k=>k.name).join(', '), act:'<button class="btn btn-sm" data-go="cards">Karten erzeugen</button>' });
  if (dueToday.length) notices.push({ cls:'calm', ic:'clock', t:plural(dueToday.length,'Buch ist','Bücher sind')+' heute fällig',

/* ---------------------------------------------------------- Bibliothek */
let lib = { q:'', avail:false, age:'', cat:'', only:null };
function screenLibrary(){
  let list = S.titles.slice();
  if (lib.only === 'damaged') list = list.filter(t => copiesOfTitle(t.id).some(c => c.status==='damaged'));
  if (lib.q){
    const q = lib.q.toLowerCase();
    list = list.filter(t => (t.title+' '+t.author+' '+t.illustrator+' '+t.cats.join(' ')+' '+t.isbn).toLowerCase().includes(q));
  }
  if (lib.avail) list = list.filter(t => availableCopies(t.id).length > 0);
  if (lib.age)  { const a = +lib.age; list = list.filter(t => a >= t.ageMin && a <= t.ageMax); }
  if (lib.cat)  list = list.filter(t => t.cats.includes(lib.cat));

  return '<div class="stack">'+
    '<div class="head-row"><div><h1 class="screen-title">Bibliothek</h1>'+
      '<p class="screen-sub">'+plural(S.titles.length,'Titel','Titel')+' · '+plural(S.copies.length,'Exemplar','Exemplare')+' · '+
      S.copies.filter(c=>c.status==='available').length+' verfügbar</p></div>'+
      '<button class="btn btn-sm" data-act="start-add">'+icon('plus')+'Buch hinzufügen</button></div>'+

      '<select class="pill" id="libAge"><option value="">Alle Altersstufen</option>'+
        [2,3,4,5,6,7].map(a=>'<option value="'+a+'"'+(lib.age==a?' selected':'')+'>'+a+' Jahre</option>').join('')+'</select>'+
      '<button class="toggle" data-act="toggle-avail" aria-pressed="'+(lib.avail?'true':'false')+'">Nur verfügbare</button>'+
    '</div>'+
    '<div class="toggle-row"><button class="toggle" data-cat="" aria-pressed="'+(lib.cat?'false':'true')+'">Alle Themen</button>'+
      kategorien().map(c=>'<button class="toggle" data-cat="'+esc(c)+'" aria-pressed="'+(lib.cat===c?'true':'false')+'">'+esc(c)+'</button>').join('')+'</div>'+
    (list.length ? '<div class="grid-books">'+list.map(t => {
        const av = availableCopies(t.id).length, total = copiesOfTitle(t.id).length;
        const flag = '<span class="c-flag'+(av?'':' none')+'">'+(av? av+'/'+total+' frei' : 'alle aus')+'</span>';
        return '<button class="book-card" data-title="'+t.id+'">'+coverArt(t, flag)+

      }).join('')+'</div>'

        '<button class="btn btn-sm" data-act="clear-filters">Filter zurücksetzen</button></div></div>')+
  '</div>';
}
